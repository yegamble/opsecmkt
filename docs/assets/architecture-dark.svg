<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="510" viewBox="0 0 1100 510" role="img" aria-label="Browser through Tor or HTTPS to the Go server and PostgreSQL. Monero (XMR) is the only payment currency. Optional custodial escrow uses a dedicated wallet RPC and per-order accounts. The market holds online wallet keys and order/payment metadata. Local nodes default to mainnet with real funds; no mainnet run is recorded. Stagenet and local fakechain are test networks. Monero delivery through Tor remains unverified.">
<title>OPSEC Market architecture: Monero only</title>
<desc>Browser through Tor or HTTPS to the Go server and PostgreSQL. Monero (XMR) is the only payment currency. Optional custodial escrow uses a dedicated wallet RPC and per-order accounts. The market holds online wallet keys and order/payment metadata. Local nodes default to mainnet with real funds; no mainnet run is recorded. Stagenet and local fakechain are test networks. Monero delivery through Tor remains unverified.</desc>
<defs><marker id="adark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#b5b0a6"/></marker></defs>
<rect width="1100" height="510" fill="#0a0a0a"/>
<rect x="20" y="200" width="150" height="95" rx="10" fill="#141412" stroke="#3a3a33" stroke-width="1.5"/>
<text x="95.0" y="229" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="16" font-weight="700" fill="#f0ede6">Browser</text>
<text x="95.0" y="250" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="400" fill="#b5b0a6">HTML + CSS</text>
<text x="95.0" y="271" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="400" fill="#b5b0a6">no JavaScript</text>
<rect x="220" y="105" width="170" height="85" rx="10" fill="#141412" stroke="#3a3a33" stroke-width="1.5"/>
<text x="305.0" y="134" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="16" font-weight="700" fill="#8ce4ac">Tor onion</text>
<text x="305.0" y="155" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="400" fill="#b5b0a6">optional mirror</text>
<text x="305.0" y="176" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="400" fill="#b5b0a6">no host port</text>
<rect x="220" y="280" width="170" height="85" rx="10" fill="#141412" stroke="#3a3a33" stroke-width="1.5"/>
<text x="305.0" y="309" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="16" font-weight="700" fill="#f0ede6">HTTPS proxy</text>
<text x="305.0" y="330" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="400" fill="#b5b0a6">clearnet option</text>
<text x="305.0" y="351" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="400" fill="#b5b0a6">Caddy or nginx</text>
<rect x="440" y="200" width="175" height="110" rx="10" fill="#141412" stroke="#3a3a33" stroke-width="1.5"/>
<text x="527.5" y="229" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="16" font-weight="700" fill="#f59e0b">Go server</text>
<text x="527.5" y="250" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="400" fill="#b5b0a6">server-rendered</text>
<text x="527.5" y="271" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="400" fill="#b5b0a6">CSRF · CSP · audit</text>
<text x="527.5" y="292" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="400" fill="#b5b0a6">per-order escrow</text>
<rect x="660" y="30" width="415" height="110" rx="10" fill="#141412" stroke="#3a3a33" stroke-width="1.5"/>
<text x="867.5" y="59" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="16" font-weight="700" fill="#f0ede6">PostgreSQL</text>
<text x="867.5" y="80" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="400" fill="#b5b0a6">migrations on start</text>
<text x="867.5" y="101" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="400" fill="#b5b0a6">orders · messages · payment metadata</text>
