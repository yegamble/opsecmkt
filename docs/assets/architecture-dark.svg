<text x="550" y="492" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#b5b0a6">Monero only · escrow off by default · mainnet uses real funds</text>
</svg>
