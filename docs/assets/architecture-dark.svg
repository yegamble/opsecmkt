<svg xmlns="http://www.w3.org/2000/svg" width="880" height="300" viewBox="0 0 880 300" role="img" aria-label="Architecture: a browser without JavaScript reaches the Go server through a Tor onion service or an HTTPS reverse proxy; the server stores data in PostgreSQL and optionally talks to test-network Bitcoin and Monero wallets."><title>OPSEC Market architecture</title><defs><marker id="adark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#b5b0a6"/></marker></defs><rect width="880" height="300" fill="#0a0a0a"/><rect x="20" y="110" width="150" height="80" rx="10" fill="#141412" stroke="#3a3a33" stroke-width="1.5"/><text x="95.0" y="144.0" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15" font-weight="700" fill="#f0ede6">Browser</text><text x="95.0" y="166.0" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#b5b0a6">HTML + CSS only</text><text x="95.0" y="183.0" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#b5b0a6">no JavaScript</text><rect x="230" y="40" width="170" height="80" rx="10" fill="#141412" stroke="#3a3a33" stroke-width="1.5"/><text x="315.0" y="74.0" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15" font-weight="700" fill="#8ce4ac">Tor onion</text><text x="315.0" y="96.0" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#b5b0a6">tor + optional mirror</text><text x="315.0" y="113.0" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#b5b0a6">no host port</text><rect x="230" y="180" width="170" height="80" rx="10" fill="#141412" stroke="#3a3a33" stroke-width="1.5"/><text x="315.0" y="214.0" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15" font-weight="700" fill="#f0ede6">HTTPS proxy</text><text x="315.0" y="236.0" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#b5b0a6">clearnet option</text><text x="315.0" y="253.0" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#b5b0a6">Caddy or nginx</text><rect x="460" y="110" width="160" height="80" rx="10" fill="#141412" stroke="#3a3a33" stroke-width="1.5"/><text x="540.0" y="144.0" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15" font-weight="700" fill="#f59e0b">Go server</text><text x="540.0" y="166.0" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#b5b0a6">server-rendered</text><text x="540.0" y="183.0" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#b5b0a6">CSRF · CSP · audit</text><rect x="690" y="40" width="170" height="80" rx="10" fill="#141412" stroke="#3a3a33" stroke-width="1.5"/><text x="775.0" y="74.0" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15" font-weight="700" fill="#f0ede6">PostgreSQL</text><text x="775.0" y="96.0" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#b5b0a6">internal or external</text><text x="775.0" y="113.0" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#b5b0a6">migrations on start</text><rect x="690" y="180" width="170" height="80" rx="10" fill="#141412" stroke="#3a3a33" stroke-width="1.5"/><text x="775.0" y="214.0" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15" font-weight="700" fill="#f0ede6">BTC / XMR</text><text x="775.0" y="236.0" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#b5b0a6">test networks only</text><text x="775.0" y="253.0" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#b5b0a6">optional wallets</text><line x1="170" y1="140" x2="228" y2="85" stroke="#b5b0a6" stroke-width="1.5" marker-end="url(#adark)"/><line x1="170" y1="160" x2="228" y2="215" stroke="#b5b0a6" stroke-width="1.5" marker-end="url(#adark)"/><line x1="400" y1="80" x2="458" y2="135" stroke="#b5b0a6" stroke-width="1.5" marker-end="url(#adark)"/><line x1="400" y1="220" x2="458" y2="165" stroke="#b5b0a6" stroke-width="1.5" marker-end="url(#adark)"/><line x1="620" y1="135" x2="688" y2="85" stroke="#b5b0a6" stroke-width="1.5" marker-end="url(#adark)"/><line x1="620" y1="165" x2="688" y2="215" stroke="#b5b0a6" stroke-width="1.5" marker-end="url(#adark)" stroke-dasharray="5 4"/></svg>
