<text x="867.5" y="220" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="400" fill="#b5b0a6">mainnet / stagenet / local fakechain</text>
<text x="867.5" y="241" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="400" fill="#b5b0a6">restricted RPC · no published port</text>
<text x="867.5" y="262" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="400" fill="#b5b0a6">explicit node Tor overlay</text>
<text x="867.5" y="283" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="400" fill="#b5b0a6">Monero Tor delivery unverified</text>
<rect x="660" y="330" width="415" height="130" rx="10" fill="#141412" stroke="#3a3a33" stroke-width="1.5"/>
<text x="867.5" y="359" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="16" font-weight="700" fill="#f0ede6">Monero custodial escrow</text>
<text x="867.5" y="380" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="400" fill="#b5b0a6">per-order accounts · monthly wallets</text>
<text x="867.5" y="401" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="400" fill="#b5b0a6">online keys · dedicated wallet RPC</text>
<text x="867.5" y="422" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="400" fill="#b5b0a6">public stagenet digital claim recorded</text>
<text x="867.5" y="443" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="400" fill="#b5b0a6">mainnet &amp; Tor delivery unverified</text>
