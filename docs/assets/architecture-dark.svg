<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="575" viewBox="0 0 1100 575" role="img" aria-label="Architecture: a JavaScript-free browser reaches the Go server through Tor or HTTPS; PostgreSQL stores application data. Optional pooled Bitcoin and Monero payments default to test networks, with mainnet an operator opt-in. Separate Bitcoin escrow is limited to regtest, signet and testnet4; Monero escrow is limited to local fakechain or stagenet. Both escrow paths are off by default and have no recorded public-network run.">
<title>OPSEC Market architecture and payment-network limits</title>
<desc>Architecture: a JavaScript-free browser reaches the Go server through Tor or HTTPS; PostgreSQL stores application data. Optional pooled Bitcoin and Monero payments default to test networks, with mainnet an operator opt-in. Separate Bitcoin escrow is limited to regtest, signet and testnet4; Monero escrow is limited to local fakechain or stagenet. Both escrow paths are off by default and have no recorded public-network run.</desc>
<defs><marker id="adark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#b5b0a6"/></marker></defs>
<rect width="1100" height="575" fill="#0a0a0a"/>
<rect x="25" y="220" width="145" height="100" rx="10" fill="#141412" stroke="#3a3a33" stroke-width="1.5"/><text x="97.5" y="255" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="16" font-weight="700" fill="#f0ede6">Browser</text><text x="97.5" y="278" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="400" fill="#b5b0a6">HTML + CSS</text><text x="97.5" y="297" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="400" fill="#b5b0a6">no JavaScript</text>
<rect x="220" y="65" width="170" height="80" rx="10" fill="#141412" stroke="#3a3a33" stroke-width="1.5"/><text x="305" y="98" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="16" font-weight="700" fill="#8ce4ac">Tor onion</text><text x="305" y="120" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#b5b0a6">optional mirror</text><text x="305" y="137" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#b5b0a6">no host port</text>
<rect x="220" y="205" width="170" height="80" rx="10" fill="#141412" stroke="#3a3a33" stroke-width="1.5"/><text x="305" y="238" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="16" font-weight="700" fill="#f0ede6">HTTPS proxy</text><text x="305" y="260" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#b5b0a6">clearnet option</text><text x="305" y="277" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#b5b0a6">Caddy or nginx</text>
<rect x="440" y="205" width="180" height="125" rx="10" fill="#141412" stroke="#3a3a33" stroke-width="1.5"/><text x="530" y="241" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="17" font-weight="700" fill="#f59e0b">Go server</text><text x="530" y="264" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="400" fill="#b5b0a6">server-rendered</text><text x="530" y="284" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#b5b0a6">CSRF · CSP · audit</text><text x="530" y="306" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#b5b0a6">pooled + escrow logic</text>
<rect x="735" y="25" width="340" height="80" rx="10" fill="#141412" stroke="#3a3a33" stroke-width="1.5"/><text x="905" y="58" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="16" font-weight="700" fill="#f0ede6">PostgreSQL</text><text x="905" y="80" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#b5b0a6">application state</text><text x="905" y="97" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#b5b0a6">migrations on start</text>
<rect x="735" y="125" width="340" height="150" rx="10" fill="#141412" stroke="#3a3a33" stroke-width="1.5"/><text x="905" y="150" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15" font-weight="700" fill="#f0ede6">Pooled wallet payments</text><text x="905" y="172" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" font-weight="400" fill="#b5b0a6">optional RPC wallets; otherwise disabled</text><text x="905" y="190" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" font-weight="400" fill="#b5b0a6">BTC + XMR test networks by default</text><text x="905" y="208" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" font-weight="400" fill="#b5b0a6">mainnet is an explicit operator opt-in</text><text x="905" y="226" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" font-weight="400" fill="#b5b0a6">both configured coins must share test/live class</text><text x="905" y="249" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" font-weight="400" fill="#b5b0a6">evidence: local chains + simulated RPC</text><text x="905" y="265" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.2" font-weight="400" fill="#b5b0a6">no public testnet or mainnet run recorded</text>
<rect x="735" y="290" width="340" height="130" rx="10" fill="#141412" stroke="#3a3a33" stroke-width="1.5"/><text x="905" y="315" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15" font-weight="700" fill="#f0ede6">Bitcoin per-order escrow</text><text x="905" y="335" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" font-weight="400" fill="#b5b0a6">ESCROW_BTC · off by default</text><text x="905" y="353" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" font-weight="400" fill="#b5b0a6">regtest / signet / testnet4 only</text><text x="905" y="371" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" font-weight="400" fill="#b5b0a6">mainnet refused; not in mainnet markets</text><text x="905" y="389" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#b5b0a6">evidence: regtest + private signet</text><text x="905" y="407" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.2" font-weight="400" fill="#b5b0a6">no public signet/testnet4 run recorded</text>
<rect x="735" y="435" width="340" height="130" rx="10" fill="#141412" stroke="#3a3a33" stroke-width="1.5"/><text x="905" y="460" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15" font-weight="700" fill="#f0ede6">Monero per-order escrow</text><text x="905" y="480" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" font-weight="400" fill="#b5b0a6">ESCROW_XMR · off by default</text><text x="905" y="498" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" font-weight="400" fill="#b5b0a6">local fakechain / stagenet only</text><text x="905" y="516" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="400" fill="#b5b0a6">mainnet + testnet refused</text><text x="905" y="534" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.2" font-weight="400" fill="#b5b0a6">evidence: fakechain + offline stagenet fork</text><text x="905" y="552" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" font-weight="400" fill="#b5b0a6">no public-network run recorded</text>
