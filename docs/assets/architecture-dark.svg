<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="575" viewBox="0 0 1100 575" role="img" aria-label="Architecture: browser through Tor or HTTPS to the Go server and PostgreSQL. Pooled Bitcoin and Monero payments use test networks by default; mainnet is an operator opt-in. Bitcoin escrow is unreleased, off by default, 2-of-3, and limited to regtest, signet and testnet4. Monero escrow is unreleased, off by default, custodial, and limited to fakechain or stagenet.">
<title>OPSEC Market architecture and network limits</title>
<desc>Architecture: browser through Tor or HTTPS to the Go server and PostgreSQL. Pooled Bitcoin and Monero payments use test networks by default; mainnet is an operator opt-in. Bitcoin escrow is unreleased, off by default, 2-of-3, and limited to regtest, signet and testnet4. Monero escrow is unreleased, off by default, custodial, and limited to fakechain or stagenet.</desc>
<defs><marker id="adark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#b5b0a6"/></marker></defs>
<rect width="1100" height="575" fill="#0a0a0a"/>
<rect x="25" y="220" width="145" height="100" rx="10" fill="#141412" stroke="#3a3a33" stroke-width="1.5"/><text x="97.5" y="255" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="16" font-weight="700" fill="#f0ede6">Browser</text><text x="97.5" y="278" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="400" fill="#b5b0a6">HTML + CSS</text><text x="97.5" y="297" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="400" fill="#b5b0a6">no JavaScript</text>
<rect x="220" y="65" width="170" height="80" rx="10" fill="#141412" stroke="#3a3a33" stroke-width="1.5"/><text x="305" y="98" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="16" font-weight="700" fill="#8ce4ac">Tor onion</text><text x="305" y="120" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#b5b0a6">optional mirror</text><text x="305" y="137" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#b5b0a6">no host port</text>
<rect x="220" y="205" width="170" height="80" rx="10" fill="#141412" stroke="#3a3a33" stroke-width="1.5"/><text x="305" y="238" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="16" font-weight="700" fill="#f0ede6">HTTPS proxy</text><text x="305" y="260" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#b5b0a6">clearnet option</text><text x="305" y="277" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#b5b0a6">Caddy or nginx</text>
<rect x="440" y="205" width="180" height="125" rx="10" fill="#141412" stroke="#3a3a33" stroke-width="1.5"/><text x="530" y="241" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="17" font-weight="700" fill="#f59e0b">Go server</text><text x="530" y="264" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="400" fill="#b5b0a6">server-rendered</text><text x="530" y="284" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#b5b0a6">CSRF · CSP · audit</text><text x="530" y="306" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#b5b0a6">pooled + escrow logic</text>
<rect x="735" y="25" width="340" height="80" rx="10" fill="#141412" stroke="#3a3a33" stroke-width="1.5"/><text x="905" y="58" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="16" font-weight="700" fill="#f0ede6">PostgreSQL</text><text x="905" y="80" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#b5b0a6">application state</text><text x="905" y="97" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#b5b0a6">migrations on start</text>
<rect x="650" y="125" width="425" height="110" rx="10" fill="#141412" stroke="#3a3a33" stroke-width="1.5"/><text x="862.5" y="150" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="17" font-weight="700" fill="#f0ede6">Pooled wallet payments</text><text x="862.5" y="174" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15" font-weight="400" fill="#b5b0a6">BTC test: testnet3, testnet4, signet, regtest</text><text x="862.5" y="193" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15" font-weight="400" fill="#b5b0a6">XMR test: testnet / stagenet</text><text x="862.5" y="212" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15" font-weight="400" fill="#b5b0a6">Mainnet opt-in; configured coins must agree</text>
<rect x="650" y="255" width="425" height="110" rx="10" fill="#141412" stroke="#3a3a33" stroke-width="1.5"/><text x="862.5" y="280" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="17" font-weight="700" fill="#f0ede6">Bitcoin per-order escrow</text><text x="862.5" y="304" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15" font-weight="400" fill="#b5b0a6">Off by default · 2-of-3 · not released</text><text x="862.5" y="323" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15" font-weight="400" fill="#b5b0a6">Regtest / signet / testnet4 only</text><text x="862.5" y="342" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15" font-weight="400" fill="#b5b0a6">Refuses mainnet, testnet3 and mainnet markets</text>
<rect x="650" y="385" width="425" height="110" rx="10" fill="#141412" stroke="#3a3a33" stroke-width="1.5"/><text x="862.5" y="410" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="17" font-weight="700" fill="#f0ede6">Monero per-order escrow</text><text x="862.5" y="434" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15" font-weight="400" fill="#b5b0a6">Off by default · not released</text><text x="862.5" y="453" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15" font-weight="400" fill="#b5b0a6">Local fakechain / stagenet only</text><text x="862.5" y="472" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15" font-weight="400" fill="#b5b0a6">Custodial · refuses testnet and mainnet</text>
