<text x="867.5" y="380" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="400" fill="#57534e">fakechain / stagenet</text>
<text x="867.5" y="401" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="400" fill="#57534e">separate escrow wallet RPC</text>
