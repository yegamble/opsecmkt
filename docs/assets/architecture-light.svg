<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="510" viewBox="0 0 1100 510" role="img" aria-label="Browser through Tor or HTTPS to the Go server and PostgreSQL. Optional Bitcoin 2-of-3 escrow: regtest, signet or testnet4. Optional custodial Monero escrow: fakechain or stagenet. Escrow is off by default, test networks only, development build. Historical pooled records retained; undrained legacy upgrades refused.">
<title>OPSEC Market architecture and supported networks</title>
<desc>Browser through Tor or HTTPS to the Go server and PostgreSQL. Optional Bitcoin 2-of-3 escrow: regtest, signet or testnet4. Optional custodial Monero escrow: fakechain or stagenet. Escrow is off by default, test networks only, development build. Historical pooled records retained; undrained legacy upgrades refused.</desc>
