# Operator-supplied, reviewed images must contain these binaries on PATH.
# No RPC or peer ports are published to the host. Test networks only: BITCOIN_CHAIN (testnet4, signet,
# regtest) and MONERO_NETWORK (stagenet, testnet); the app refuses mainnet. RPC ports are pinned so the
# installer's URLs do not depend on the chain.
# RPC credentials come from .env (the installer generates them). Without BITCOIN_RPC_PASSWORD bitcoind falls
# back to cookie authentication, so nothing on the network (including the app) can use its RPC. Without
# MONERO_WALLET_RPC_PASSWORD monero-wallet-rpc gets --rpc-login ':' (empty user name), which it rejects at
# startup instead of running without authentication. Neither falls back to a guessable password.
services:
  bitcoin:
    image: ${BITCOIN_IMAGE:-scratch}
    profiles: [bitcoin]
    restart: unless-stopped
    networks: [backend, node_egress]
    entrypoint: [bitcoind]
    command:
      - -datadir=/data
      - -chain=${BITCOIN_CHAIN:-testnet4}
      - -server=1
      - -printtoconsole=1
      - -rpcbind=0.0.0.0
      - -rpcport=8332
      - -rpcallowip=172.16.0.0/12
      - -rpcallowip=192.168.0.0/16
      - -rpcuser=marketplace
      - -rpcpassword=${BITCOIN_RPC_PASSWORD:-}
      # Test networks often have too little fee data for estimation; without a fallback fee every payout
      # would fail. 0.0002 tBTC/kvB (20 sat/vB) is deliberately generous so test payouts confirm.
      - -fallbackfee=0.0002
    volumes: [bitcoin_data:/data]
  monero:
    image: ${MONERO_IMAGE:-scratch}
    profiles: [monero]
    restart: unless-stopped
    networks: [backend, node_egress]
    entrypoint: [monerod]
    command: ['--${MONERO_NETWORK:-stagenet}', --data-dir, /data, --non-interactive, --restricted-rpc, --rpc-bind-ip, 0.0.0.0, --rpc-bind-port, '18081', --confirm-external-bind]
    volumes: [monero_data:/data]
  monero-wallet:
    # The same reviewed Monero image must also provide monero-wallet-rpc. Reachable only on the backend network.
    image: ${MONERO_IMAGE:-scratch}
    profiles: [monero-wallet]
    restart: unless-stopped
    networks: [backend]
    entrypoint: [monero-wallet-rpc]
    command: ['--${MONERO_NETWORK:-stagenet}', --daemon-address, 'monero:18081', --trusted-daemon, --wallet-dir, /wallet, --rpc-bind-ip, 0.0.0.0, --rpc-bind-port, '18083', --confirm-external-bind, --rpc-login, '${MONERO_WALLET_RPC_PASSWORD:+marketplace}:${MONERO_WALLET_RPC_PASSWORD:-}']
    volumes: [monero_wallet:/wallet]
volumes:
  bitcoin_data:
  monero_data:
  monero_wallet:

networks:
  node_egress:
