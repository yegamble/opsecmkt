# Default images: bitcoin/bitcoin (unofficial image, with upstream binary signature checks) and
# Seth for Privacy's Monero daemon and wallet-RPC images. Override *_IMAGE in .env to use reviewed
# alternatives. The defaults are the release tags the payout error handling was verified against (Bitcoin
# Core 31.1, Monero v0.18.5.1; payments_watcher.go walletRejected). Never change them to latest: follow the
# bump checklist in docs/operator-guide.md#node-image-versions. Add @sha256:<digest> for reproducible deployments.
# No RPC or peer ports are published to the host. BITCOIN_CHAIN (testnet4, signet, regtest, or main) and
# MONERO_NETWORK (stagenet, testnet, or mainnet) select the network; the app accepts mainnet only when they
# name it. monerod and monero-wallet-rpc have no --mainnet flag (mainnet is their default), so a mainnet .env
# also sets MONERO_NETWORK_FLAG= (blank) to drop the flag. RPC ports are pinned so the installer's URLs do not
# depend on the chain.
# RPC credentials come from .env (the installer generates them). Without BITCOIN_RPC_PASSWORD bitcoind falls
# back to cookie authentication, so nothing on the network (including the app) can use its RPC. Without
# MONERO_WALLET_RPC_PASSWORD monero-wallet-rpc gets --rpc-login ':' (empty user name), which it rejects at
# startup instead of running without authentication. Neither falls back to a guessable password.
# Same log rotation as compose.yaml (anchors do not cross files; CI checks every service has it).
x-logging: &logging
  driver: ${LOG_DRIVER:-json-file}
  options:
    max-size: 10m
    max-file: '3'
services:
  bitcoin:
    image: ${BITCOIN_IMAGE:-bitcoin/bitcoin:31.1}
    profiles: [bitcoin]
    restart: unless-stopped
    networks: [backend, node_egress]
    environment:
      BITCOIN_DATA: /data
    command:
      - -chain=${BITCOIN_CHAIN:-testnet4}
      # Explicit, so the data directory does not depend on the image entrypoint reading BITCOIN_DATA.
      - -datadir=/data
      # Pruned by default: bitcoind keeps about BITCOIN_PRUNE_MB MiB of recent block and undo files (at least
      # 550) and deletes older ones. 2000 leaves a margin over the minimum for rescanning recent wallet
      # backups; BITCOIN_PRUNE_MB=0 runs an unpruned full node. See docs/operator-guide.md#local-node-pruning.
      - -prune=${BITCOIN_PRUNE_MB:-2000}
      - -server=1
      - -printtoconsole=1
      - -rpcbind=0.0.0.0
      - -rpcport=8332
      - -rpcallowip=172.16.0.0/12
      - -rpcallowip=192.168.0.0/16
      - -rpcuser=marketplace
      - -rpcpassword=${BITCOIN_RPC_PASSWORD:-}
      # Test networks often have too little fee data for estimation; without a fallback fee every payout
      # would fail. 0.0002 BTC/kvB (20 sat/vB) is deliberately generous so test payouts confirm; on mainnet a
      # synced node estimates its own fee and uses this only when it cannot.
      - -fallbackfee=0.0002
    volumes: [bitcoin_data:/data]
    # Sized for a pruned test-network node: its database cache and mempool (at most 300 MB by default) plus
    # headroom for the initial sync (docs/operator-guide.md#resource-limits-and-log-rotation).
    mem_limit: 2g
    cpu_period: 100000
    cpu_quota: 200000
    pids_limit: 256
    logging: *logging
  monero:
    image: ${MONERO_IMAGE:-ghcr.io/sethforprivacy/simple-monerod:v0.18.5.1}
    profiles: [monero]
    restart: unless-stopped
    networks: [backend, node_egress]
    # Pruned by default. monerod has no --prune-blockchain=false, so this command is a string: a blank
    # MONERO_PRUNE_FLAGS= in .env adds no flag and runs a full node, while an unset one uses the default.
    # See docs/operator-guide.md#local-node-pruning.
    command: >-
      ${MONERO_NETWORK_FLAG---${MONERO_NETWORK:-stagenet}} --data-dir=/home/monero/.bitmonero --restricted-rpc
      --rpc-restricted-bind-ip=0.0.0.0 --rpc-restricted-bind-port=18081 --confirm-external-bind
      ${MONERO_PRUNE_FLAGS---prune-blockchain --sync-pruned-blocks}
    volumes: [monero_data:/home/monero/.bitmonero]
    # monerod starts a thread per core for sync and verification, so pids_limit leaves room on large hosts.
    mem_limit: 2g
    cpu_period: 100000
    cpu_quota: 200000
    pids_limit: 512
    logging: *logging
  monero-wallet:
    # Separate wallet-RPC image; reachable only on the backend network.
    image: ${MONERO_WALLET_IMAGE:-ghcr.io/sethforprivacy/simple-monero-wallet-rpc:v0.18.5.1}
    profiles: [monero-wallet]
    restart: unless-stopped
    networks: [backend]
    # A string, so a blank MONERO_NETWORK_FLAG adds no argument (mainnet); the password must not contain a
    # single quote (the installer generates a hex one).
    command: >-
      ${MONERO_NETWORK_FLAG---${MONERO_NETWORK:-stagenet}} --daemon-address monero:18081 --trusted-daemon
      --wallet-dir=/home/monero/wallet --rpc-bind-port=18083 --rpc-login 'marketplace:${MONERO_WALLET_RPC_PASSWORD:-}'
    volumes: [monero_wallet:/home/monero/wallet]
    mem_limit: 512m
    cpu_period: 100000
    cpu_quota: 100000
    pids_limit: 128
    logging: *logging
volumes:
  bitcoin_data:
  monero_data:
  monero_wallet:

networks:
  node_egress:
