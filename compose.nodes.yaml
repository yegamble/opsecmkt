# Default images: bitcoin/bitcoin (unofficial image, with upstream binary signature checks) and
# Seth for Privacy's Monero daemon and wallet-RPC images. Override *_IMAGE in .env to use reviewed
# alternatives. The defaults are the release tags the payout error handling was verified against (Bitcoin
# Core 31.1, Monero v0.18.5.1; payments_watcher.go walletRejected). Never change them to latest: follow the
# bump checklist in docs/operator-guide.md#node-image-versions. Add @sha256:<digest> for reproducible deployments.
# No RPC or peer ports are published to the host. BITCOIN_CHAIN (testnet4, signet, regtest, or main) and
# MONERO_NETWORK (stagenet, testnet, or mainnet) select the network; the app accepts mainnet only when they
# name it. monerod and monero-wallet-rpc have no --mainnet flag (mainnet is their default), so a mainnet .env
# also sets MONERO_NETWORK_FLAG= (blank) to drop the flag. RPC ports are pinned so the installer's URLs do not
# depend on the chain.
# RPC credentials come from .env (the installer generates them). Without BITCOIN_RPC_PASSWORD bitcoind falls
# back to cookie authentication, so nothing on the network (including the app) can use its RPC. Compose refuses
# to create or start monero-wallet without MONERO_WALLET_RPC_PASSWORD, and monero-escrow-wallet without
# ESCROW_XMR_WALLET_RPC_PASSWORD (A-466): every command with that service's profile active stops with "env file
# .../<KEY>-is-blank not found" (see their env_file). An install whose COMPOSE_PROFILES leaves a wallet out needs
# neither password. Were a wallet started anyway, its --rpc-login would be ':' (the user name follows the password's
# presence), which monero-wallet-rpc 0.18.5.1 rejects at startup. None runs without authentication or falls back to
# a guessable password.
# Same log rotation as compose.yaml (anchors do not cross files; CI checks every service has it).
x-logging: &logging
  driver: ${LOG_DRIVER:-json-file}
  options:
    max-size: 10m
    max-file: '3'
services:
  bitcoin:
    image: ${BITCOIN_IMAGE:-bitcoin/bitcoin:31.1}
    profiles: [bitcoin]
    restart: unless-stopped
    networks: [backend, node_egress]
    environment:
      BITCOIN_DATA: /data
    command:
      - -chain=${BITCOIN_CHAIN:-testnet4}
      # Explicit, so the data directory does not depend on the image entrypoint reading BITCOIN_DATA.
      - -datadir=/data
      # Pruned by default: bitcoind keeps about BITCOIN_PRUNE_MB MiB of recent block and undo files (at least
      # 550) and deletes older ones. 2000 leaves a margin over the minimum for rescanning recent wallet
      # backups; BITCOIN_PRUNE_MB=0 runs an unpruned full node. See docs/operator-guide.md#local-node-pruning.
      - -prune=${BITCOIN_PRUNE_MB:-2000}
      - -server=1
      - -printtoconsole=1
      - -rpcbind=0.0.0.0
      - -rpcport=8332
      - -rpcallowip=172.16.0.0/12
      - -rpcallowip=192.168.0.0/16
      - -rpcuser=marketplace
      - -rpcpassword=${BITCOIN_RPC_PASSWORD:-}
      # Test networks often have too little fee data for estimation; without a fallback fee every payout
      # would fail. 0.0002 BTC/kvB (20 sat/vB) is deliberately generous so test payouts confirm; on mainnet a
      # synced node estimates its own fee and uses this only when it cannot.
      - -fallbackfee=0.0002
    volumes: [bitcoin_data:/data]
    # Sized for a pruned test-network node: its database cache and mempool (at most 300 MB by default) plus
    # headroom for the initial sync (docs/operator-guide.md#resource-limits-and-log-rotation).
    mem_limit: 2g
    cpu_period: 100000
    cpu_quota: 200000
    pids_limit: 256
    logging: *logging
  monero:
    image: ${MONERO_IMAGE:-ghcr.io/sethforprivacy/simple-monerod:v0.18.5.1}
    profiles: [monero]
    restart: unless-stopped
    networks: [backend, node_egress]
    # Pruned by default. monerod has no --prune-blockchain=false, so this command is a string: a blank
    # MONERO_PRUNE_FLAGS= in .env adds no flag and runs a full node, while an unset one uses the default.
    # See docs/operator-guide.md#local-node-pruning.
    command: >-
      ${MONERO_NETWORK_FLAG---${MONERO_NETWORK:-stagenet}} --data-dir=/home/monero/.bitmonero --restricted-rpc
      --rpc-restricted-bind-ip=0.0.0.0 --rpc-restricted-bind-port=18081 --confirm-external-bind
      ${MONERO_PRUNE_FLAGS---prune-blockchain --sync-pruned-blocks}
    volumes: [monero_data:/home/monero/.bitmonero]
    # monerod starts a thread per core for sync and verification, so pids_limit leaves room on large hosts.
    mem_limit: 2g
    cpu_period: 100000
    cpu_quota: 200000
    pids_limit: 512
    logging: *logging
  monero-wallet:
    # Separate wallet-RPC image; reachable only on the backend network.
    image: ${MONERO_WALLET_IMAGE:-ghcr.io/sethforprivacy/simple-monero-wallet-rpc:v0.18.5.1}
    profiles: [monero-wallet]
    restart: unless-stopped
    networks: [backend]
    # A string, so a blank MONERO_NETWORK_FLAG adds no argument (mainnet); the password must not contain a
    # single quote (the installer generates a hex one).
    command: >-
      ${MONERO_NETWORK_FLAG---${MONERO_NETWORK:-stagenet}} --daemon-address monero:18081 --trusted-daemon
      --wallet-dir=/home/monero/wallet --rpc-bind-port=18083
      --rpc-login '${MONERO_WALLET_RPC_PASSWORD:+marketplace}:${MONERO_WALLET_RPC_PASSWORD:-}'
    # The refusal of a blank password (A-466). A ${VAR:?} would stop every Compose command of every install, since
    # interpolation ignores profiles; a missing env file stops only those with this profile active. Blank, the path is
    # the missing file MONERO_WALLET_RPC_PASSWORD-is-blank in the project directory; set, the ".." steps (Compose
    # cleans a relative path; enough for a project directory up to 31 levels deep) lead to /dev/null, which adds
    # nothing to the environment. The short form: an env file Compose cannot find is an error in every version (the
    # long form's `required` needs Compose 2.24).
    env_file:
      - MONERO_WALLET_RPC_PASSWORD-is-blank${MONERO_WALLET_RPC_PASSWORD:+/../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../dev/null}
    volumes: [monero_wallet:/home/monero/wallet]
    mem_limit: 512m
    cpu_period: 100000
    cpu_quota: 100000
    pids_limit: 128
    logging: *logging
  monero-escrow-wallet:
    # Monero escrow's own wallet-RPC (ESCROW_XMR=on, A-449; docs/operator-guide.md#monero-escrow-fakechain-or-stagenet):
    # stagenet only, attached to the monero service, which must then run stagenet (MONERO_NETWORK=stagenet). It holds
    # only escrow wallets, in its own volume, behind its own login: never the monero-wallet service, whose wallet it
    # would close (monero-wallet-rpc holds one wallet open at a time). The installer generates
    # ESCROW_XMR_WALLET_RPC_PASSWORD; Compose refuses this service without it (A-466, env_file below, as for
    # monero-wallet). Were it started anyway, the login would be ':' (the user name follows the password's presence),
    # which monero-wallet-rpc 0.18.5.1 refuses at startup; 'escrow:' would start it with an empty password (probed,
    # A-449). Reachable only on the backend network. Back the volume up yourself: scripts/backup.sh does not copy
    # wallet volumes.
    image: ${MONERO_WALLET_IMAGE:-ghcr.io/sethforprivacy/simple-monero-wallet-rpc:v0.18.5.1}
    profiles: [monero-escrow-wallet]
    restart: unless-stopped
    networks: [backend]
    command: >-
      --stagenet --daemon-address monero:18081 --trusted-daemon --wallet-dir=/home/monero/wallet
      --rpc-bind-port=18083 --rpc-login '${ESCROW_XMR_WALLET_RPC_PASSWORD:+escrow}:${ESCROW_XMR_WALLET_RPC_PASSWORD:-}'
    env_file:
      - ESCROW_XMR_WALLET_RPC_PASSWORD-is-blank${ESCROW_XMR_WALLET_RPC_PASSWORD:+/../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../dev/null}
    volumes: [monero_escrow_wallet:/home/monero/wallet]
    # An escrow wallet holds one account per order; PAYE-E2 measured 574 MB at peak over five 10,000-account wallets
    # (docs/verification.md), so this is twice the pooled wallet's limit.
    mem_limit: 1g
    cpu_period: 100000
    cpu_quota: 100000
    pids_limit: 128
    logging: *logging
  escrow-signer:
    # The market's dedicated signer for per-order (shape (b)) Bitcoin escrows (A-454; no order uses it yet). Same image
    # as the app, run as its own user (65533, in the app's group 65532 so the app can open its mode-0660 socket). Its
    # seed lives only in escrow_signer_seed, mounted nowhere else (never in .env, the database or scripts/backup.sh's
    # output: back it up with `escrow-signer backup`). It publishes no port and listens on no network; it joins backend
    # only to reach the escrow node's RPC as its own whitelisted user (ESCROW_SIGNER_RPC_URL). The app reaches it through
    # the escrow_signer_socket volume alone. docs/operator-guide.md#escrow-signer.
    build: .
    profiles: [escrow-signer]
    restart: unless-stopped
    networks: [backend]
    user: '65533:65532'
    entrypoint: [/app/escrow-signer]
    command: [serve]
    environment:
      ESCROW_SIGNER_SEED_FILE: /var/lib/escrow-signer/seed
      ESCROW_SIGNER_SOCKET: /run/escrow-signer/signer.sock
      ESCROW_SIGNER_RPC_URL: ${ESCROW_SIGNER_RPC_URL:-}
    volumes:
      - escrow_signer_seed:/var/lib/escrow-signer
      - escrow_signer_socket:/run/escrow-signer
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    cpu_period: 100000
    cpu_quota: 100000
    pids_limit: 64
    logging: *logging
  app:
    # The escrow signer's socket (ESCROW_SIGNER_SOCKET=/run/escrow-signer/signer.sock); an empty volume until the
    # escrow-signer profile runs.
    volumes:
      - escrow_signer_socket:/run/escrow-signer
volumes:
  bitcoin_data:
  monero_data:
  monero_wallet:
  monero_escrow_wallet:
  escrow_signer_seed:
  escrow_signer_socket:

networks:
  node_egress:
