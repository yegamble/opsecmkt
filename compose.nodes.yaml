# Monero daemon and escrow wallet-RPC images. Override *_IMAGE in .env with reviewed pinned releases.
# No RPC or peer ports are published. Blank MONERO_NETWORK_FLAG runs mainnet; absent runs stagenet.
# Mainnet is an explicit operator choice with real funds. See docs/operator-guide.md#mainnet.
# Escrow wallet startup requires ESCROW_XMR_WALLET_RPC_PASSWORD. Log rotation matches compose.yaml.
x-logging: &logging
  driver: ${LOG_DRIVER:-json-file}
  options:
    max-size: 10m
    max-file: '3'
services:
  monero:
    image: ${MONERO_IMAGE:-ghcr.io/sethforprivacy/simple-monerod:v0.18.5.1}
    profiles: [monero]
    restart: unless-stopped
    networks: [backend, node_egress]
    # Pruned by default. monerod has no --prune-blockchain=false, so this command is a string: a blank
    # MONERO_PRUNE_FLAGS= in .env adds no flag and runs a full node, while an unset one uses the default.
    # See docs/operator-guide.md#local-node-pruning. MONERO_NETWORK_FLAG (default --stagenet) picks the network: a
    # blank MONERO_NETWORK_FLAG= runs mainnet, which monerod selects with no flag (MONERO_NETWORK=mainnet, A-460).
    # monerod also runs a core RPC server, at the network's default port (18081 on mainnet) unless pinned. It is pinned
    # to 127.0.0.1:18089 inside the container: on mainnet it would otherwise take 18081 from the restricted server and
    # monerod would exit with "Failed to bind IPv4" (A-524; scripts/test-monerod-ports.sh). The app and
    # monero-escrow-wallet use the restricted 18081. --no-igd and --no-zmq are image defaults this command replaces:
    # no UPnP port mapping on the host's router, no ZMQ server (A-536). The image's --enable-dns-blocklist stays off:
    # its lookups would leave outside Tor with compose.nodes-tor.yaml.
    command: >-
      ${MONERO_NETWORK_FLAG---stagenet} --data-dir=/home/monero/.bitmonero --restricted-rpc
      --rpc-bind-ip=127.0.0.1 --rpc-bind-port=18089
      --rpc-restricted-bind-ip=0.0.0.0 --rpc-restricted-bind-port=18081 --confirm-external-bind --no-igd --no-zmq
      ${MONERO_PRUNE_FLAGS---prune-blockchain --sync-pruned-blocks}
    volumes: [monero_data:/home/monero/.bitmonero]
    # The image's own user from the start, with a read-only root: no root entrypoint step, so the volume must already
    # belong to 1000:1000 (a new volume does; after restoring one as root, see docs/operator-guide.md#troubleshooting).
    user: '1000:1000'
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    # monerod starts a thread per core for sync and verification, so pids_limit leaves room on large hosts.
    mem_limit: 2g
    cpu_period: 100000
    cpu_quota: 200000
    pids_limit: 512
    logging: *logging
  monero-escrow-wallet:
    # Monero escrow's own wallet-RPC (ESCROW_XMR=on, A-449; docs/operator-guide.md#monero-escrow):
    # on the monero service's network (MONERO_NETWORK_FLAG, as there: stagenet, or mainnet when blank), attached to it. It holds
    # only escrow wallets, in its own volume, behind its own login. The installer generates
    # ESCROW_XMR_WALLET_RPC_PASSWORD; Compose refuses this service without it (A-466, env_file below, as for
    # the wallet service). Were it started anyway, the login would be ':' (the user name follows the password's presence),
    # which monero-wallet-rpc 0.18.5.1 refuses at startup; 'escrow:' would start it with an empty password (probed,
    # A-449). Reachable only on the backend network. Back the volume up yourself: scripts/backup.sh does not copy
    # wallet volumes.
    image: ${MONERO_WALLET_IMAGE:-ghcr.io/sethforprivacy/simple-monero-wallet-rpc:v0.18.5.1}
    profiles: [monero-escrow-wallet]
    restart: unless-stopped
    networks: [backend]
    command: >-
      ${MONERO_NETWORK_FLAG---stagenet} --daemon-address monero:18081 --trusted-daemon --wallet-dir=/home/monero/wallet
      --shared-ringdb-dir=/home/monero/wallet/.shared-ringdb
      --rpc-bind-port=18083 --log-file=/tmp/monero-wallet-rpc.log
      --max-log-file-size=1048576 --max-log-files=2
      --rpc-login '${ESCROW_XMR_WALLET_RPC_PASSWORD:+escrow}:${ESCROW_XMR_WALLET_RPC_PASSWORD:-}'
    env_file:
      - ESCROW_XMR_WALLET_RPC_PASSWORD-is-blank${ESCROW_XMR_WALLET_RPC_PASSWORD:+/../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../../dev/null}
    volumes: [monero_escrow_wallet:/home/monero/wallet]
    # As for monero: the image's user, no capabilities, a read-only root; the volume must belong to 1000:1000.
    user: '1000:1000'
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    # An escrow wallet holds one account per order; PAYE-E2 measured 574 MB at peak over five 10,000-account wallets
    # (docs/verification.md), with room for its account database.
    mem_limit: 1g
    cpu_period: 100000
    cpu_quota: 100000
    pids_limit: 128
    logging: *logging
volumes:
  monero_data:
  # Retained for recovery of retired pooled wallets; no running service mounts it.
  monero_wallet:
  monero_escrow_wallet:

networks:
  node_egress:
