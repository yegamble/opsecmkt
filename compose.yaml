name: opsecmkt
# Every service's logs rotate: Docker keeps at most three 10 MB logs per container (docker compose logs reads
# them). LOG_DRIVER in .env picks the driver: json-file (default) or local, the drivers that take these options;
# for another driver see docs/operator-guide.md#resource-limits-and-log-rotation. compose.tor.yaml and
# compose.nodes.yaml repeat this block, because YAML anchors do not cross files.
x-logging: &logging
  driver: ${LOG_DRIVER:-json-file}
  options:
    max-size: 10m
    max-file: '3'
services:
  app:
    build:
      context: .
      # scripts/install.sh sets these (A-696): the clean checkout's tag and commit, which `version` and /admin/system
      # report, and the build day, which rebuilds the image's apt-get upgrade layer. Unset, the image says "development".
      args:
        BUILD_VERSION: ${OPSECMKT_BUILD_VERSION:-}
        BUILD_COMMIT: ${OPSECMKT_BUILD_COMMIT:-}
        SECURITY_REFRESH: ${OPSECMKT_SECURITY_REFRESH:-}
    restart: unless-stopped
    networks: [backend]
    environment:
      ADDR: ':8080'
      DATABASE_URL: ${DATABASE_URL:?Run scripts/install.sh first}
      # The app itself refuses to start without a usable APP_SECRET_KEY or SETUP_TOKEN (see UPGRADING.md), and
      # without SETUP_TOKEN until first-run setup is complete.
      APP_SECRET_KEY: ${APP_SECRET_KEY:-}
      SETUP_TOKEN: ${SETUP_TOKEN:-}
      APP_MODE: ${APP_MODE:-clearnet}
      # First-start defaults only; saved administrator choices take precedence on later starts.
      INITIAL_SITE_ACCESS: ${INITIAL_SITE_ACCESS:-public}
      INITIAL_REGISTRATIONS: ${INITIAL_REGISTRATIONS:-open}
      # Blank preserves the existing single-listener install. compose.admin-tor.yaml sets a private Unix socket.
      ADMIN_SOCKET: ${ADMIN_SOCKET:-}
      # Fixed public gateway origin for administrator-authorized logo uploads; blank preserves existing installs.
      BRANDING_UPLOAD_ORIGIN: ${BRANDING_UPLOAD_ORIGIN:-}
      # The market's public addresses, named in every PGP sign-in code; never the administrator onion. Blank = none.
      OFFICIAL_ADDRESSES: ${OFFICIAL_ADDRESSES:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      # Only read to check that APP_MODE matches the exposure overlay (compose.tor.yaml or compose.clearnet.yaml).
      COMPOSE_FILE: ${COMPOSE_FILE:-}
      # Startup phase bounds; blank uses the app defaults (15s, 10m, 10m). See docs/operator-guide.md#migrations.
      DATABASE_CONNECT_TIMEOUT: ${DATABASE_CONNECT_TIMEOUT:-}
      MIGRATION_LOCK_TIMEOUT: ${MIGRATION_LOCK_TIMEOUT:-}
      MIGRATION_TIMEOUT: ${MIGRATION_TIMEOUT:-}
      # The most all stored photos and avatars may use, in MB; blank uses 2048 (docs/operator-guide.md#troubleshooting).
      IMAGE_STORAGE_LIMIT_MB: ${IMAGE_STORAGE_LIMIT_MB:-}
      BITCOIN_RPC_URL: ${BITCOIN_RPC_URL:-}
      # Keep obsolete mappings blank by default so old values reach the startup guard.
      BITCOIN_WALLET: ${BITCOIN_WALLET:-}
      # Retired Bitcoin keys remain guard inputs only. Monero mainnet needs an explicit network choice.
      BITCOIN_CHAIN: ${BITCOIN_CHAIN:-}
      MONERO_RPC_URL: ${MONERO_RPC_URL:-}
      MONERO_WALLET_RPC_URL: ${MONERO_WALLET_RPC_URL:-}
      MONERO_NETWORK: ${MONERO_NETWORK:-}
      PAYMENT_CONFIRMATIONS_XMR: ${PAYMENT_CONFIRMATIONS_XMR:-10}
      PAYMENT_POLL_INTERVAL: ${PAYMENT_POLL_INTERVAL:-30s}
      PAYMENT_EXPIRY: ${PAYMENT_EXPIRY:-24h}
      MONERO_MAX_TIP_AGE: ${MONERO_MAX_TIP_AGE:-1h}
      AUDIT_SIGNING_KEY: ${AUDIT_SIGNING_KEY:-}
      # Optional public OpenPGP recipient key file inside this container; mount it read-only in an override.
      AUDIT_EXPORT_RECIPIENT: ${AUDIT_EXPORT_RECIPIENT:-}
      # Opt in after announcing retention and inventorying holds/backups; state must survive database rollback.
      RETENTION_ENABLED: ${RETENTION_ENABLED:-off}
      RETENTION_STATE_DIR: /var/lib/opsecmkt-retention
      # Retired Bitcoin inputs reach the startup refusal; this build supports Monero only.
      ESCROW_BTC: ${ESCROW_BTC:-}
      ESCROW_BTC_RPC_URL: ${ESCROW_BTC_RPC_URL:-}
      ESCROW_BTC_ARBITER_WALLET: ${ESCROW_BTC_ARBITER_WALLET:-}
      ESCROW_BTC_WATCH_WALLET: ${ESCROW_BTC_WATCH_WALLET:-}
      ESCROW_BTC_FEE_BPS: ${ESCROW_BTC_FEE_BPS:-}
      ESCROW_BTC_FEE_ADDRESS: ${ESCROW_BTC_FEE_ADDRESS:-}
      ESCROW_BTC_FEE_RATE: ${ESCROW_BTC_FEE_RATE:-}
      # Reject a legacy signer configuration; no signer is shipped or mounted.
      ESCROW_SIGNER_SOCKET: ${ESCROW_SIGNER_SOCKET:-}
      # Monero escrow: a local Monero fakechain or stagenet, or mainnet on a mainnet market (MONERO_NETWORK=mainnet, A-460);
      # off unless ESCROW_XMR=on; blank values use the app defaults (docs/operator-guide.md#monero-escrow). ESCROW_XMR_SEED_KEY is a path inside this
      # container: mount the public key file read-only there (the app container has no volume for it by default).
      ESCROW_XMR: ${ESCROW_XMR:-}
      ESCROW_XMR_WALLET_RPC_URL: ${ESCROW_XMR_WALLET_RPC_URL:-}
      ESCROW_XMR_DAEMON_URL: ${ESCROW_XMR_DAEMON_URL:-}
      ESCROW_XMR_FEE_BPS: ${ESCROW_XMR_FEE_BPS:-}
      ESCROW_XMR_FEE_ADDRESS: ${ESCROW_XMR_FEE_ADDRESS:-}
      ESCROW_XMR_SLOTS: ${ESCROW_XMR_SLOTS:-}
      ESCROW_XMR_MAX_FEE: ${ESCROW_XMR_MAX_FEE:-}
      ESCROW_XMR_SEED_KEY: ${ESCROW_XMR_SEED_KEY:-}
      # With APP_MODE=tor, Monero escrow relays wait unless COMPOSE_FILE has compose.nodes-tor.yaml or this is
      # clearnet-accepted (A-515).
      ESCROW_XMR_TOR_RELAY: ${ESCROW_XMR_TOR_RELAY:-}
      MONERO_WALLET_SECRET: ${MONERO_WALLET_SECRET:-}
      # Photo uploads: clamd:3310 with compose.scanner.yaml and the scanner profile; blank keeps uploads off.
      CLAMD_ADDRESS: ${CLAMD_ADDRESS:-}
      # Days the scanner's daily signatures may age before uploads pause; blank uses 30 (7 to 90).
      SCANNER_MAX_SIGNATURE_AGE_DAYS: ${SCANNER_MAX_SIGNATURE_AGE_DAYS:-}
      # Go's garbage collector works harder as the heap nears this, below mem_limit (512m), so that load makes
      # the app slower rather than killed mid-request. Raise both together (docs/operator-guide.md#resource-limits-and-log-rotation).
      GOMEMLIMIT: 400MiB
    # Healthy once /healthz answers "ok" (the app is serving and reaches PostgreSQL); `up --wait` waits for it.
    # start_period covers migrations on a large database; raise it with MIGRATION_TIMEOUT if needed.
    healthcheck:
      test: [CMD, /app/server, -healthcheck]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 2m
    # Shutdown waits for in-flight requests (10 s) and then for an in-flight payout send (at most 30 s,
    # payoutSendTimeout, plus 10 s to record it); keep this above their sum so a redeploy never kills a
    # broadcast half-way.
    stop_grace_period: 60s
    read_only: true
    tmpfs: [/tmp]
    volumes: [retention_state:/var/lib/opsecmkt-retention]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    # Resource ceilings, so a flood or a leak in one container cannot starve the host (sizes and how to change
    # them: docs/operator-guide.md#resource-limits-and-log-rotation). CPU is capped as cpu_quota/cpu_period (here
    # 2 CPUs), not `cpus`: Docker refuses to start a container whose `cpus` exceeds the host's CPU count.
    mem_limit: 512m
    cpu_period: 100000
    cpu_quota: 200000
    pids_limit: 512
    logging: *logging
  db:
    image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    profiles: [internal-db]
    restart: unless-stopped
    networks: [backend]
    environment:
      POSTGRES_DB: opsecmkt
      POSTGRES_USER: opsecmkt
      # A fresh internal database must refuse a missing password; external-db installs leave this profile off.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_INITDB_ARGS: --encoding=UTF8
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -h 127.0.0.1 -U opsecmkt -d opsecmkt']
      interval: 5s
      timeout: 5s
      retries: 20
    # postgres (70:70) from the start, with a read-only root: no root entrypoint step, so the volume must already
    # belong to 70:70 (a new volume does; after restoring one as root, see docs/operator-guide.md#troubleshooting).
    # The socket, lock and temporary files go to memory (A-536; scripts/test-service-hardening.sh); the entrypoint's
    # "chmod: /var/run/postgresql: Operation not permitted" at each start is harmless.
    user: '70:70'
    read_only: true
    tmpfs: [/var/run/postgresql, /tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 1g
    cpu_period: 100000
    cpu_quota: 200000
    pids_limit: 256
    logging: *logging
volumes:
  postgres_data:
  retention_state:

networks:
  backend:
