# torrc resolves app:8080 to an IP address once, when Tor starts. `restart: true` restarts Tor whenever
# Compose recreates or restarts the app (whose IP address can change), so the onion keeps answering.
# Requires Docker Compose 2.17 or later.
services:
  tor:
    build:
      context: deploy
      dockerfile: Dockerfile.tor
    restart: unless-stopped
    depends_on:
      app:
        condition: service_started
        restart: true
    networks: [backend, tor_egress]
    volumes: [tor_identity:/var/lib/tor]
    # Healthy once Tor has written the onion address; its descriptor may take 1-3 more minutes to publish.
    healthcheck:
      test: [CMD-SHELL, 'test -s /var/lib/tor/marketplace/hostname']
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 1m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
  tor-mirror:
    profiles: [mirror]
    build:
      context: deploy
      dockerfile: Dockerfile.tor
    restart: unless-stopped
    depends_on:
      app:
        condition: service_started
        restart: true
    networks: [backend, tor_egress]
    volumes: [tor_mirror_identity:/var/lib/tor]
    healthcheck:
      test: [CMD-SHELL, 'test -s /var/lib/tor/marketplace/hostname']
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 1m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
volumes:
  tor_mirror_identity:
  tor_identity:

networks:
  backend:
    internal: true
  tor_egress:
