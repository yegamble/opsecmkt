# clamd configuration for OPSEC Market's malware scanner (compose.scanner.yaml, war room A-184).
# Bind-mounted read-only over the image's /etc/clamav/clamd.conf. Every option the upload path depends on is
# set here explicitly, even where it matches the default, so a new ClamAV release cannot change it silently.
# Options are checked against the pinned release's clamd.conf.sample; tests/test_compose_scanner.py checks this
# file and scripts/test-scanner.sh runs it in the pinned image.

# ---- Listening ----
# The app reaches clamd as clamd:3310 over the `scanner` network (internal, members app and clamd only); no
# port is published to the host. 0.0.0.0 is the container's own interfaces, which only that network reaches.
TCPSocket 3310
TCPAddr 0.0.0.0
Foreground yes

# ---- Control commands ----
# The app sends only PING, VERSION and INSTREAM. SHUTDOWN, RELOAD and STATS answer COMMAND UNAVAILABLE, so
# nothing on the scanner network can stop clamd or read its statistics (restart: unless-stopped covers a crash).
# VERSION stays on: the app reads the signature date from it.
EnableShutdownCommand no
EnableReloadCommand no
EnableStatsCommand no

# ---- Files and logging ----
# The image's own signatures, read-only (no volume, no freshclam). SelfCheck re-reads the directory every
# 10 minutes; in this read-only container it never changes, so the check costs nothing and never reloads.
DatabaseDirectory /var/lib/clamav
SelfCheck 600
# Only one engine is ever loaded: a reload would block scans briefly instead of doubling the memory.
ConcurrentDatabaseReload no
# Streamed uploads are written here while scanned: a tmpfs (compose.scanner.yaml), never the image layer.
TemporaryDirectory /tmp
LeaveTemporaryFiles no
# No LogFile: clamd logs to its standard output and error, which Docker rotates (x-logging). A stream: OK answer
# is not logged, so the log holds no record of ordinary uploads.
LogTime yes
LogClean no

# ---- Scanning limits ----
# The app sends at most 4 MiB per upload, once, and only after its own byte, type and pixel caps. The limits
# below sit above that, so a real photo never reaches them; AlertExceedsMax turns any limit that is still
# reached into a detection (Heuristics.Limits.Exceeded.*), which the app refuses, instead of a stream: OK
# answer for a file clamd only partly scanned.
StreamMaxLength 9M
MaxFileSize 9M
MaxScanSize 18M
AlertExceedsMax yes

# ---- Images ----
# Image files (JPEG and PNG are all the app accepts) go through clamd's image parsers.
ScanImage yes
# Off, explicitly: image fuzzy hashing is unmeasured for memory and for false positives on phone photos
# (war room C6; revisited after A-197).
ScanImageFuzzyHash no
# Off: a slightly malformed but decodable phone JPEG would be refused as Broken.Media (revisited after A-197).
AlertBrokenMedia no
