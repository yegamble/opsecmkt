name: Scan built image
description: Report all known image vulnerabilities and reject fixable high or critical findings.
inputs:
  image-ref:
    description: Local image tag to scan (use this or image-archive).
    required: false
    default: ''
  image-archive:
    description: Built OCI or Docker archive to scan (use this or image-ref).
    required: false
    default: ''
  artifact-name:
    description: Unique report artifact name.
    required: true
runs:
  using: composite
  steps:
    - name: Report all image vulnerabilities
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
      with:
        version: 'v0.76.0'
        image-ref: ${{ inputs.image-ref }}
        input: ${{ inputs.image-archive }}
        scanners: vuln
        format: json
        output: trivy-report.json
        exit-code: '0'
        ignore-unfixed: false
        timeout: 10m
        # Scanner databases refresh on each run; cache only avoids repeated downloads.
        cache: true
    - name: Annotate actionable image vulnerabilities
      shell: bash
      env:
        REPORT_RENDERER: ${{ github.action_path }}/report.py
      run: python3 "$REPORT_RENDERER" trivy-report.json
    - name: Reject fixable high or critical vulnerabilities
      shell: bash
      env:
        IMAGE_REF: ${{ inputs.image-ref }}
        IMAGE_ARCHIVE: ${{ inputs.image-archive }}
      run: |
        args=(--cache-dir .cache/trivy --scanners vuln --exit-code 1 --ignore-unfixed --severity HIGH,CRITICAL --timeout 10m)
        if [ -n "$IMAGE_ARCHIVE" ] && [ -z "$IMAGE_REF" ]; then
          trivy image "${args[@]}" --input "$IMAGE_ARCHIVE"
        elif [ -n "$IMAGE_REF" ] && [ -z "$IMAGE_ARCHIVE" ]; then
          trivy image "${args[@]}" "$IMAGE_REF"
        else
          echo 'Supply exactly one image-ref or image-archive' >&2
          exit 1
        fi
    - name: Preserve full image vulnerability report
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ inputs.artifact-name }}
        path: trivy-report.json
        if-no-files-found: warn
        retention-days: 14
