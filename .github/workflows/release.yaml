name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  verify:
    uses: ./.github/workflows/ci.yaml
  package:
    name: Draft image release
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require a version tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: '[[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]'
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build OCI archive with provenance and SBOM
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          tags: opsecmkt:${{ github.ref_name }}
          outputs: type=oci,dest=opsecmkt.oci.tar
          provenance: mode=max
          sbom: true
          # Built from scratch: no Actions cache feeds a release image.
          no-cache: true
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # Release binaries are built without restoring any Actions cache.
          cache: false
      - name: Build the offline audit export verifier
        run: |
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            goos=${target%/*}
            goarch=${target#*/}
            suffix=''
            if [ "$goos" = windows ]; then suffix=.exe; fi
            CGO_ENABLED=0 GOOS=$goos GOARCH=$goarch go build -trimpath -buildvcs=false -ldflags='-s -w -buildid=' \
              -o "verify-audit-$goos-$goarch$suffix" ./cmd/verify-audit
          done
          # The runner's own build must run and refuse a call without an export and signature.
          if ./verify-audit-linux-amd64 2> usage.txt; then exit 1; fi
          grep -q 'usage: verify-audit -pub' usage.txt
          rm usage.txt
      - name: Package checksums and build record
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gzip -n opsecmkt.oci.tar
          python3 - <<'PY'
          import json, os
          with open('build.json', 'w') as output:
              json.dump({'repository': os.environ['GITHUB_REPOSITORY'], 'commit': os.environ['GITHUB_SHA'], 'tag': os.environ['RELEASE_TAG'], 'run': os.environ['GITHUB_SERVER_URL'] + '/' + os.environ['GITHUB_REPOSITORY'] + '/actions/runs/' + os.environ['GITHUB_RUN_ID'], 'platform': 'linux/amd64', 'format': 'OCI image archive; embedded BuildKit SBOM and provenance', 'verify_audit': sorted(name for name in os.listdir('.') if name.startswith('verify-audit-'))}, output, indent=2)
              output.write('\n')
          PY
          sha256sum opsecmkt.oci.tar.gz build.json verify-audit-* > SHA256SUMS
      - name: Create private draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cat > release-notes.md <<'NOTES'
          Tested Linux amd64 OCI image archive. Verify SHA256SUMS before importing with an OCI-aware tool such as Skopeo. The archive embeds BuildKit provenance and an SBOM. These are build metadata, not a cryptographic signature. See docs/ci-cd.md for import and rollback instructions. No production deployment is performed.

          verify-audit-OS-ARCH are standalone builds of cmd/verify-audit for checking a signed audit export offline: verify-audit -pub <key from /canary> export.jsonl export.sig (exit 0 = valid). They are listed in SHA256SUMS.
          NOTES
          gh release create "$RELEASE_TAG" opsecmkt.oci.tar.gz SHA256SUMS build.json verify-audit-* \
            --verify-tag --draft --title "$RELEASE_TAG" --notes-file release-notes.md
