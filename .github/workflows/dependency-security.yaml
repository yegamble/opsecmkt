name: Dependency security
on:
  workflow_call:
permissions:
  contents: read
jobs:
  go-vulnerabilities:
    name: Reachable Go vulnerabilities (including tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tools/go.sum
            tools/actionlint/go.sum
      - run: make vuln
  npm-vulnerabilities:
    name: npm vulnerabilities (${{ matrix.directory }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        directory: ['.', 'deploy/docs/cloudflare']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      # npm audit reads the lockfile without installing packages or executing lifecycle scripts.
      - run: npm audit --audit-level=high
        working-directory: ${{ matrix.directory }}
  python-vulnerabilities:
    name: Python documentation and scanner vulnerabilities
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install hash-locked scanners
        run: python -m pip install --require-hashes --no-deps -r .github/requirements-security.txt
      - name: Audit the complete documentation lockfile
        run: python -m pip_audit --strict --require-hashes --no-deps --disable-pip -r requirements-docs.txt
      - name: Audit the complete scanner lockfile
        run: python -m pip_audit --strict --require-hashes --no-deps --disable-pip -r .github/requirements-security.txt
