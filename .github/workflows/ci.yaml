name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    name: Go quality and unused code
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tools/go.sum
      - run: make go-quality
  workflow-safety:
    name: Workflow security and shell analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tools/go.sum
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install pinned workflow and shell analyzers
        run: |
          python -m pip install --require-hashes --no-deps -r .github/requirements-security.txt
          curl --fail --show-error --silent --location --proto '=https' --tlsv1.2 \
            https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz \
            -o "$RUNNER_TEMP/shellcheck.tar.xz"
          printf '%s  %s\n' 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198 "$RUNNER_TEMP/shellcheck.tar.xz" | sha256sum --check
          tar -xJf "$RUNNER_TEMP/shellcheck.tar.xz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/shellcheck-v0.11.0" >> "$GITHUB_PATH"
      - name: Validate Actions definitions and embedded shell
        run: make workflow-lint
      - name: Audit Actions security
        run: zizmor --offline --strict-collection .github/workflows .github/actions
      - name: Analyze tracked repository shell scripts
        run: git ls-files -z -- '*.sh' | xargs -0 --no-run-if-empty shellcheck
  security:
    name: Dependency vulnerability gates
    uses: ./.github/workflows/dependency-security.yaml # zizmor: ignore[self-repository] -- same-commit reusable workflow, supported by actionlint.
  go:
    name: Go and PostgreSQL
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test-ci-only
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U test -d postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://test:test-ci-only@127.0.0.1:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Install cjpeg (progressive, RGB and 4:4:4 JPEGs for TestDecodeAllocationWithinEstimate)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends libjpeg-turbo-progs
      # A-465: the Go tests run as two parallel jobs, this one and `go-escrow` below. Their patterns must be the same
      # string, -skip here and -run there, so together they run every top-level test exactly once
      # (tests/test_ci_go_split.py checks that). Never edit one without the other.
      - name: Races (including real PostgreSQL), without the escrow and Monero tests
        run: go test -race -count=1 -timeout 17m -skip '^(TestEscrow|TestXMR|FuzzEscrow)' -coverprofile=coverage.out ./...
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: go-coverage
          path: coverage.out
          retention-days: 14
  # A-465: the other half of the Go tests. The `go` job alone took 14m42s of its test step on a 20-minute job and Phase 4
  # adds tests to internal/market, so the escrow and Monero tests (the -run pattern below, the exact complement of the
  # -skip pattern in `go`) run here, in parallel, on their own runner and PostgreSQL. Nothing is skipped or weakened and
  # no timeout is raised. Only TestDecodeAllocationWithinEstimate needs cjpeg and it stays in `go`.
  go-escrow:
    name: Go escrow and Monero tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test-ci-only
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U test -d postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://test:test-ci-only@127.0.0.1:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Escrow and Monero races (including real PostgreSQL)
        run: go test -race -count=1 -timeout 17m -run '^(TestEscrow|TestXMR|FuzzEscrow)' -coverprofile=coverage-escrow.out ./...
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: go-escrow-coverage
          path: coverage-escrow.out
          retention-days: 14
  # A-498: the real-chain Monero escrow legs. scripts/test-escrow-xmr-regtest.sh runs the app, inside go test, against a
  # real monerod and three real monero-wallet-rpc (all v0.18.5.1) on a local fakechain (--regtest, offline, difficulty 1:
  # a chain nobody else can reach) and a disposable PostgreSQL. The nodes are started with docker run, exactly as the
  # script's header documents, because a service container cannot take command arguments and three legs stop and restart
  # containers. Measured locally at 569 s for all 15 legs (go test 525 s), so the 25-minute limit leaves headroom.
  # Digests measured when the tags were checked (the repository pins these images by tag, as the installer does):
  # simple-monerod@sha256:0329465ffc599048efd57712d91d3b4b7d66380bd7205d5d0992cd9faf668e38 and
  # simple-monero-wallet-rpc@sha256:09ff81f470d6d37811e3fde808c5cd1158a8cd2c42abbfb935b33f26f91e879d.
  # The script itself fails a leg that fails, is skipped or does not run, and refuses a daemon that is not a fakechain.
  escrow-xmr-regtest:
    name: Monero escrow on a real fakechain
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test-ci-only
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U test -d postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://test:test-ci-only@127.0.0.1:5432/postgres?sslmode=disable
      MONERO_IMAGE: ghcr.io/sethforprivacy/simple-monerod:v0.18.5.1
      MONERO_WALLET_IMAGE: ghcr.io/sethforprivacy/simple-monero-wallet-rpc:v0.18.5.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      # The commands of the script's header. The wallet-rpcs listen without RPC login, published on 127.0.0.1 only.
      - name: Start monerod on a fakechain and three monero-wallet-rpc
        run: |
          docker network create xmr-escrow-regtest
          docker run -d --name xmr-escrow-monerod --network xmr-escrow-regtest -p 127.0.0.1:28381:18081 \
            "$MONERO_IMAGE" --regtest --keep-fakechain --offline --fixed-difficulty 1 \
            --rpc-bind-ip 0.0.0.0 --rpc-bind-port 18081 --confirm-external-bind --no-igd
          for w in escrow:28382 funder:28383 restore:28384; do
            docker run -d --name "xmr-escrow-wallet-${w%%:*}" --network xmr-escrow-regtest -p "127.0.0.1:${w##*:}:18083" \
              -v "xmr-escrow-wallet-${w%%:*}:/home/monero/wallet" -e RPC_EXPOSE_UNAUTHENTICATED=1 "$MONERO_WALLET_IMAGE" \
              --daemon-address xmr-escrow-monerod:18081 --trusted-daemon --wallet-dir /home/monero/wallet --disable-rpc-login \
              --shared-ringdb-dir /home/monero/wallet/.shared-ringdb --rpc-bind-port 18083 --allow-mismatched-daemon-version
          done
          rpc() { # rpc <port> <method>: the JSON-RPC answer, or nothing
            curl -sS --max-time 5 --noproxy '*' -H 'Content-Type: application/json' \
              --data "{\"jsonrpc\":\"2.0\",\"id\":\"0\",\"method\":\"$2\"}" "http://127.0.0.1:$1/json_rpc" 2>/dev/null || true
          }
          up=no
          for _ in $(seq 120); do
            if rpc 28381 get_info | tr -d ' \n' | grep -q '"nettype":"fakechain"' &&
              rpc 28382 get_version | grep -q '"version"' && rpc 28383 get_version | grep -q '"version"' &&
              rpc 28384 get_version | grep -q '"version"'; then
              up=yes
              break
            fi
            sleep 1
          done
          if [ "$up" != yes ]; then
            echo "monerod or a monero-wallet-rpc did not answer within 120 seconds" >&2
            docker logs --tail 50 xmr-escrow-monerod >&2 || true
            exit 1
          fi
      - name: Monero escrow legs on a real fakechain (scripts/test-escrow-xmr-regtest.sh)
        run: bash scripts/test-escrow-xmr-regtest.sh
        env:
          ESCROW_XMR_REGTEST_DAEMON_URL: http://127.0.0.1:28381
          ESCROW_XMR_REGTEST_WALLET_URL: http://127.0.0.1:28382
          ESCROW_XMR_REGTEST_FUNDER_URL: http://127.0.0.1:28383
          ESCROW_XMR_REGTEST_RESTORE_URL: http://127.0.0.1:28384
          ESCROW_XMR_REGTEST_WALLET_CONTAINER: xmr-escrow-wallet-escrow
          ESCROW_XMR_REGTEST_DAEMON_CONTAINER: xmr-escrow-monerod
          ESCROW_XMR_REGTEST_LOG: artifacts/escrow-xmr-regtest/transcript.log
      - name: Collect the nodes' logs
        if: always()
        run: |
          mkdir -p artifacts/escrow-xmr-regtest
          for c in xmr-escrow-monerod xmr-escrow-wallet-escrow xmr-escrow-wallet-funder xmr-escrow-wallet-restore; do
            docker logs "$c" > "artifacts/escrow-xmr-regtest/$c.log" 2>&1 || true
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: escrow-xmr-regtest-results
          path: artifacts/escrow-xmr-regtest/
          if-no-files-found: ignore
          retention-days: 14
      - name: Remove the nodes, their volumes and the network
        if: always()
        run: |
          docker rm -f -v xmr-escrow-monerod xmr-escrow-wallet-escrow xmr-escrow-wallet-funder xmr-escrow-wallet-restore || true
          docker volume rm xmr-escrow-wallet-escrow xmr-escrow-wallet-funder xmr-escrow-wallet-restore || true
          docker network rm xmr-escrow-regtest || true
  operations:
    name: Operations and encrypted restore
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test-ci-only
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U test -d postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Install PostgreSQL 17 client and encryption tools
        run: |
          sudo apt-get update
          sudo apt-get install -y curl ca-certificates gnupg
          sudo install -d /usr/share/postgresql-common/pgdg
          curl --fail --show-error --silent --location https://www.postgresql.org/media/keys/ACCC4CF8.asc -o "$RUNNER_TEMP/pgdg.asc"
          fingerprint=$(gpg --show-keys --with-colons "$RUNNER_TEMP/pgdg.asc" | awk -F: '$1 == "fpr" { print $10; exit }')
          test "$fingerprint" = B97B0AFCAA1A47F044F244A07FCC7D46ACCC4CF8
          sudo install -m 0644 "$RUNNER_TEMP/pgdg.asc" /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          # Hosted ubuntu-24.04 uses noble; scope trust to this repository only.
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt noble-pgdg main" | sudo tee /etc/apt/sources.list.d/opsecmkt-pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17 age
          echo /usr/lib/postgresql/17/bin >> "$GITHUB_PATH"
      # The installer and Compose tests of the malware scanner (A-184) run here too; the Docker-backed ones skip
      # only without Docker Compose, which this runner has, so any skip fails the step.
      - name: Shell syntax and Python helper regressions
        run: |
          for script in scripts/*.sh; do bash -n "$script"; done
          python3 scripts/test-backup-retention.py
          python3 -m unittest discover -s tests -p 'test_*.py' -v 2> "$RUNNER_TEMP/unittest.log" || { cat "$RUNNER_TEMP/unittest.log"; exit 1; }
          cat "$RUNNER_TEMP/unittest.log"
          if grep -E ' \.\.\. skipped' "$RUNNER_TEMP/unittest.log"; then echo 'Python tests were skipped' >&2; exit 1; fi
      - name: Encrypted backup and restore against PostgreSQL
        run: bash scripts/test-backup-restore.sh
        env:
          TEST_DATABASE_URL: postgres://test:test-ci-only@127.0.0.1:5432/postgres?sslmode=disable
      # The default deployment: its db service publishes no port, so backup and restore run inside it.
      - name: Encrypted backup and restore through the internal-db Compose service
        run: bash scripts/test-internal-db-restore.sh
      # UPGRADING.md section 42 (A-481, QA5W3B-1 and -2) on a SQL_ASCII and a LATIN1 database, in its own container.
      - name: Moving a non-UTF8 database to UTF8
        run: bash scripts/test-utf8-migration.sh
  compose:
    name: Compose (${{ matrix.mode }}, ${{ matrix.database }}, mirror=${{ matrix.mirror }}, nodes-tor=${{ matrix.nodes_tor }})
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        mode: [clearnet, tor]
        database: [internal, external]
        mirror: ['off', 'on']
        # compose.nodes-tor.yaml (A-442): local nodes over their own Tor client; Tor mode only.
        nodes_tor: ['off', 'on']
        exclude:
          - mode: clearnet
            mirror: 'on'
          - mode: clearnet
            nodes_tor: 'on'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate all deployment profiles
        env:
          MODE: ${{ matrix.mode }}
          DATABASE: ${{ matrix.database }}
          MIRROR: ${{ matrix.mirror }}
          NODES_TOR: ${{ matrix.nodes_tor }}
          DATABASE_URL: postgres://test:test@db/test
          SETUP_TOKEN: ci-validation-only-not-a-real-bootstrap-secret
          # Compose refuses the Monero escrow wallet-rpc profile with a blank password (A-466;
          # tests/test_compose_wallet_passwords.py checks the refusal).
          ESCROW_XMR_WALLET_RPC_PASSWORD: ci-validation-only
        run: |
          files=(-f compose.yaml -f "compose.$MODE.yaml" -f compose.nodes.yaml)
          profiles=(--profile monero)
          if [ "$DATABASE" = internal ]; then
            files+=(-f compose.internal-db.yaml)
            profiles+=(--profile internal-db)
          elif [ "$MODE" = tor ]; then
            files+=(-f compose.external-egress.yaml)
          fi
          if [ "$MIRROR" = on ]; then
            profiles+=(--profile mirror)
          fi
          # After compose.nodes.yaml, whose node commands it replaces (scripts/install.sh check refuses it before).
          if [ "$NODES_TOR" = on ]; then
            files+=(-f compose.nodes-tor.yaml)
          fi
          # Without the malware scanner (the default), then with it: compose.scanner.yaml and its profile (A-184).
          docker compose "${files[@]}" "${profiles[@]}" config --quiet
          files+=(-f compose.scanner.yaml)
          profiles+=(--profile scanner)
          docker compose "${files[@]}" "${profiles[@]}" config --quiet
          # Monero escrow on stagenet (A-449): its own wallet-rpc service and the overlay mounting its seed key.
          ESCROW_XMR=on ESCROW_XMR_SEED_KEY=/etc/opsecmkt/escrow-xmr-seed-key.asc \
            docker compose "${files[@]}" -f compose.escrow-xmr.yaml "${profiles[@]}" --profile monero-escrow-wallet config --quiet
          # `up --wait` needs a healthcheck on the app (its -healthcheck flag) and, in Tor mode, on each Tor service
          # (the onion hostname file exists).
          docker compose "${files[@]}" "${profiles[@]}" config --format json | python3 -c '
          import json, sys
          services = json.load(sys.stdin)["services"]
          mode, mirror, nodes_tor = sys.argv[1], sys.argv[2], sys.argv[3]
          want = {"app": ["CMD", "/app/server", "-healthcheck"], "clamd": ["CMD", "clamdcheck.sh"]}
          for name in ["tor"] + (["tor-mirror"] if mirror == "on" else []) if mode == "tor" else []:
              want[name] = ["CMD-SHELL", "test -s /var/lib/tor/marketplace/hostname"]
          if nodes_tor == "on":
              want["tor-socks"] = ["CMD", "bash", "-c", "exec 3<>/dev/tcp/10.199.42.2/9050"]
          for name, test in want.items():
              got = services.get(name, {}).get("healthcheck", {})
              if got.get("test") != test or got.get("disable"):
                  sys.exit(f"{name} must have healthcheck {test!r}, got {got!r}")
          print("healthchecks:", ", ".join(want))
          ' "$MODE" "$MIRROR" "$NODES_TOR"
          # Every service has resource ceilings and rotated logs (A-180, A-144); a new service must be added here.
          # Enable the optional Monero escrow wallet for this resolved-config pass too: its separate overlay and
          # password-protected profile were previously validated with --quiet, outside the resource assertions.
          # LOG_DRIVER picks the logging driver (blank: json-file); the rotation options stay.
          limits_files=("${files[@]}" -f compose.escrow-xmr.yaml)
          limits_profiles=("${profiles[@]}" --profile monero-escrow-wallet)
          for log_driver in "" local; do
          ESCROW_XMR=on ESCROW_XMR_SEED_KEY=/etc/opsecmkt/escrow-xmr-seed-key.asc LOG_DRIVER="$log_driver" \
            docker compose "${limits_files[@]}" "${limits_profiles[@]}" config --format json | python3 -c '
          import json, sys
          services = json.load(sys.stdin)["services"]
          units = {"m": 2**20, "g": 2**30}
          if "monero-escrow-wallet" not in services:
              sys.exit("monero-escrow-wallet profile was not included in the resource-limit check")
          # service: (mem_limit, CPUs as cpu_quota / cpu_period, pids_limit). Not cpus: Docker refuses to create a
          # container whose cpus exceed the host CPU count, which would break 1-CPU hosts.
          limits = {"app": ("512m", 2, 512), "db": ("1g", 2, 256), "tor": ("256m", 1, 64), "tor-mirror": ("256m", 1, 64),
                    "monero": ("2g", 2, 512),
                    "monero-escrow-wallet": ("1g", 1, 128),
                    "clamd": ("3g", 2, 256), "tor-socks": ("256m", 1, 64)}
          logging = {"driver": sys.argv[1] or "json-file", "options": {"max-size": "10m", "max-file": "3"}}
          for name, service in sorted(services.items()):
              if name not in limits:
                  sys.exit(f"{name} has no expected resource limits in the CI check")
              memory, cpus, pids = limits[name]
              got = (service.get("mem_limit"), service.get("cpu_quota"), service.get("cpu_period"), service.get("pids_limit"), service.get("cpus"))
              if (got[0] is None or int(got[0]) != int(memory[:-1]) * units[memory[-1]] or got[2] != 100000
                      or got[1] != cpus * 100000 or got[3] != pids or got[4] is not None):
                  sys.exit(f"{name} must have mem_limit {memory}, cpu_period 100000 with cpu_quota {cpus * 100000}, pids_limit {pids} and no cpus; "
                           f"got (mem_limit, cpu_quota, cpu_period, pids_limit, cpus) {got!r}")
              rotation = service.get("logging")
              if rotation != logging:
                  sys.exit(f"{name} must rotate its logs with {logging!r}, got {rotation!r}")
          # The Go heap target stays below the app container memory limit.
          if services["app"].get("environment", {}).get("GOMEMLIMIT") != "400MiB":
              sys.exit("app must set GOMEMLIMIT=400MiB below its 512m mem_limit")
          print("limits and log rotation (" + logging["driver"] + "):", ", ".join(sorted(services)))
          ' "$log_driver"
          done
          # torrc resolves app:8080 once at startup, so Tor must restart whenever the app is recreated.
          if [ "$MODE" = tor ]; then
            docker compose "${files[@]}" "${profiles[@]}" config --format json | python3 -c '
          import json, sys
          services = json.load(sys.stdin)["services"]
          names = ["tor"] + (["tor-mirror"] if sys.argv[1] == "on" else [])
          for name in names:
              app = services.get(name, {}).get("depends_on", {}).get("app", {})
              if app.get("condition") != "service_started" or app.get("restart") is not True:
                  sys.exit(f"{name} must depend on app with condition service_started and restart: true, got {app!r}")
          print("restart with app:", ", ".join(names))
          ' "$MIRROR"
          fi
          # The malware scanner (A-184, ruling C1): clamd reads the pinned image's own signatures (no volume, no
          # freshclam), hardened, on the internal scanner network that only it and the app join; nothing waits for it.
          docker compose "${files[@]}" "${profiles[@]}" config --format json | python3 -c '
          import json, re, sys
          config = json.load(sys.stdin)
          services, clamd = config["services"], config["services"]["clamd"]
          members = sorted(name for name, service in services.items() if "scanner" in (service.get("networks") or {}))
          networks = list(clamd.get("networks") or {})
          if members != ["app", "clamd"] or networks != ["scanner"] or config["networks"]["scanner"].get("internal") is not True:
              sys.exit(f"the internal scanner network must hold exactly app and clamd, and clamd only it; got {members!r}, {networks!r}")
          for name, service in services.items():
              if "clamd" in (service.get("depends_on") or {}):
                  sys.exit(f"{name} must not depend on clamd")
          want = {"user": "clamav", "read_only": True, "cap_drop": ["ALL"], "security_opt": ["no-new-privileges:true"],
                  "entrypoint": ["clamd"], "command": ["--foreground", "--config-file=/etc/clamav/clamd.conf"],
                  "tmpfs": ["/tmp:size=64m"], "profiles": ["scanner"], "restart": "unless-stopped"}
          for key, value in want.items():
              if clamd.get(key) != value:
                  sys.exit(f"clamd must have {key} {value!r}, got {clamd.get(key)!r}")
          volumes = [(volume["type"], volume["target"], volume.get("read_only")) for volume in clamd.get("volumes", [])]
          if volumes != [("bind", "/etc/clamav/clamd.conf", True)] or any(key in clamd for key in ("ports", "environment", "network_mode")):
              sys.exit(f"clamd must mount only clamd.conf, read-only, and publish nothing; got volumes {volumes!r}")
          if clamd["healthcheck"].get("start_period") != "10m0s":
              sys.exit("clamd healthcheck start_period must be 10m")
          # One release with signatures: MAJOR.MINOR.PATCH (optionally -debian) or a digest; latest, stable, unstable
          # and 1.5 (and their -debian forms) move to other releases, _base has no signatures.
          image = clamd["image"]
          reference, _, digest = image.partition("@")
          tag = reference.rpartition("/")[2].partition(":")[2]
          if not (re.fullmatch(r"\d+\.\d+\.\d+(-debian)?", tag) or (digest and "_base" not in tag)):
              sys.exit(f"clamd image must be one ClamAV release with signatures, not {image!r}")
          print("scanner:", image, "on the internal scanner network with", ", ".join(members))
          '
          # Bitcoin services and signer secrets are retired; the app receives legacy variables only to refuse them.
          docker compose "${files[@]}" "${profiles[@]}" config --format json | python3 -c '
          import json, sys
          config = json.load(sys.stdin)
          if {"bitcoin", "escrow-signer"} & config["services"].keys():
              sys.exit("Monero-only deployments must not start Bitcoin services")
          for name, service in config["services"].items():
              if any(v.get("source") in {"escrow_signer_seed", "escrow_signer_socket", "bitcoin_data"}
                     for v in service.get("volumes", [])):
                  sys.exit(f"{name} still mounts a retired Bitcoin volume")
          '
          # The local Monero node is pruned by default; blank MONERO_PRUNE_FLAGS runs a full node.
          check_nodes() {
            docker compose "${files[@]}" "${profiles[@]}" config --format json | python3 -c '
          import json, sys
          services = json.load(sys.stdin)["services"]
          monero = services["monero"]["command"]
          pruned = sys.argv[1] == "pruned"
          for flag in ("--stagenet", "--data-dir=/home/monero/.bitmonero", "--restricted-rpc", "--confirm-external-bind"):
              if flag not in monero:
                  sys.exit(f"monero lost {flag}: {monero!r}")
          if "" in monero:
              sys.exit(f"monero command has an empty argument: {monero!r}")
          want = ["--prune-blockchain", "--sync-pruned-blocks"] if pruned else []
          if [arg for arg in monero if "prune" in arg] != want:
              sys.exit(f"monero prune flags must be {want!r}, got {monero!r}")
          print(sys.argv[1], "Monero node:", " ".join(want) or "no prune flags")
          ' "$1"
          }
          check_nodes pruned
          MONERO_PRUNE_FLAGS='' check_nodes full
          # Local nodes over Tor (A-442; tests/test_tor_deploy.py checks the rest): the proxy flags and never -connect
          # or -onlynet; the node network is internal and holds only the nodes and tor-socks, which publishes nothing;
          # every network of a node is internal. tests/test_ci_tor_socks.py checks that this block stays.
          if [ "$NODES_TOR" = on ]; then
            docker compose "${files[@]}" "${profiles[@]}" config --format json | python3 -c '
          import json, sys
          config = json.load(sys.stdin)
          services, networks = config["services"], config["networks"]
          monero, socks = services["monero"]["command"], services["tor-socks"]
          if monero[-1:] != ["--proxy=10.199.42.2:9050"]:
              sys.exit(f"monero must end with --proxy=10.199.42.2:9050, got {monero!r}")
          members = sorted(name for name, service in services.items() if "node_egress" in (service.get("networks") or {}))
          if (members != ["monero", "tor-socks"] or networks["node_egress"].get("internal") is not True
                  or sorted(socks["networks"]) != ["node_egress", "tor_socks_egress"] or "ports" in socks or "expose" in socks):
              sys.exit(f"node_egress must be internal and hold only monero and tor-socks, and tor-socks publish nothing; got {members!r}")
          # Whatever other overlay is in the list, no network of a node may have a route out (only tor-socks has one).
          routes = sorted(f"{name} on {network}" for name in ("monero",) for network in services[name]["networks"]
                          if networks[network].get("internal") is not True)
          if routes:
              sys.exit(f"every network of monero must be internal, got {routes!r}")
          print("nodes over Tor:", monero[-1], "on internal node_egress with", ", ".join(members))
          '
          fi
          # Node and wallet images default to the release tags the payment error tables were verified against
          # (A-100): a floating or missing tag could upgrade monero-wallet-rpc under moneroPreSubmitCodes.
          docker compose "${files[@]}" "${profiles[@]}" config --format json | python3 -c '
          import json, sys
          services = json.load(sys.stdin)["services"]
          for name in ("monero",):
              image = services[name]["image"]
              reference, _, digest = image.partition("@")
              tag = reference.rpartition("/")[2].partition(":")[2]
              if tag == "latest" or not (tag or digest):
                  sys.exit(f"{name} image must be a pinned release tag or digest, not {image!r}")
              print(name, "image:", image)
          '
      # The step above passes explicit --profile flags, which hides a documented command that drops the profiles
      # an installed .env lists. This one writes COMPOSE_FILE and COMPOSE_PROFILES as scripts/install.sh does.
      - name: Documented mirror commands with the installer's .env
        if: matrix.mode == 'tor' && matrix.mirror == 'on' && matrix.nodes_tor == 'off'
        env:
          DATABASE: ${{ matrix.database }}
        run: bash scripts/test-mirror-commands.sh "$DATABASE"
  container:
    name: Container runtime (${{ matrix.database }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        database: [internal, external]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: opsecmkt:ci
          cache-from: type=gha,scope=app
          cache-to: type=gha,mode=max,scope=app
      # Both runtime matrix entries exercise this image; scan it once.
      - name: Scan the built application image
        if: matrix.database == 'internal'
        uses: ./.github/actions/scan-image # zizmor: ignore[self-repository] -- scan this checkout's image with its reviewed composite action.
        with:
          image-ref: opsecmkt:ci
          artifact-name: application-image-vulnerabilities
      - name: Bootstrap production image with a real database
        run: bash scripts/ci-smoke.sh "${{ matrix.database }}"
      # A-192: the app, the database and the pinned clamd of compose.scanner.yaml whose only signature database is
      # deploy/testdata/clamav-test.ndb, packed at job time into an unsigned daily.cud (a test signature, not a
      # production signature feed): uploads refused and stored, clamd stopped and started, SHUTDOWN, isolation.
      - name: Malware scanner leg (pinned clamd, test signature only)
        run: bash scripts/ci-smoke.sh "${{ matrix.database }}" scanner
      # The scanner container as compose.scanner.yaml defines it, with the image's own signatures, read-only and
      # with no network (ruling C1); the same for both database modes, so it runs once.
      - name: Malware scanner container, read-only and offline
        if: matrix.database == 'internal'
        run: bash scripts/test-scanner.sh
  installer:
    name: Local installer, setup wizard, terminal bootstrap and upgrade
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install, set up (browser and terminal), upgrade an alpha-layout .env, in isolated real deployments
        run: python3 scripts/test-install.py
      - name: Preserve installer evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installer-results
          path: artifacts/install-test/
          if-no-files-found: ignore
          retention-days: 14
  upgrade:
    name: Upgrade from alpha.1 and an intermediate migrated release
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history and tags: the test builds and runs the v0.1.0-alpha.1 server from its tag.
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Install PostgreSQL client and age for upgrade rehearsal
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends postgresql-client age
      - name: Upgrade alpha.1 and intermediate databases on PostgreSQL 17
        run: bash scripts/test-upgrade.sh
  tor-image:
    name: Tor image and offline configuration
    runs-on: ubuntu-24.04
    # Include the full image report/CVE gate as well as the offline runtime checks.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: deploy
          file: deploy/Dockerfile.tor
          load: true
          tags: opsecmkt-tor:ci
          cache-from: type=gha,scope=tor
          cache-to: type=gha,mode=max,scope=tor
      - name: Scan the built Tor image
        uses: ./.github/actions/scan-image # zizmor: ignore[self-repository] -- scan this checkout's image with its reviewed composite action.
        with:
          image-ref: opsecmkt-tor:ci
          artifact-name: tor-image-vulnerabilities
      - name: Validate Tor configuration without network access
        run: docker run --rm --network none --add-host app:127.0.0.1 --cap-drop ALL --security-opt no-new-privileges:true opsecmkt-tor:ci --verify-config
      # A-179: proof-of-work needs tor 0.4.8 or later built with the pow module (the image build also refuses one
      # without it), and tor must read deploy/torrc's onion-service defences with the intended values.
      - name: Tor version, pow module and onion-service defences
        run: |
          tor=(docker run --rm --network none --add-host app:127.0.0.1 --cap-drop ALL --security-opt no-new-privileges:true opsecmkt-tor:ci)
          version=$("${tor[@]}" --version | sed -n 's/^Tor version \([0-9.]*\)\..*/\1/p')
          echo "tor $version"
          printf '%s\n' 0.4.8 "$version" | sort -V -C || { echo "tor $version is older than 0.4.8" >&2; exit 1; }
          modules=$("${tor[@]}" --list-modules)
          echo "$modules"
          grep -qx 'pow: yes' <<< "$modules"
          # --dump-config short prints the configuration as tor parsed it (per-service lines in their service's block).
          config=$("${tor[@]}" --dump-config short)
          echo "$config"
          for line in 'HeartbeatPeriod 1800' 'MaxMemInQueues 134217728' 'HiddenServiceDir /var/lib/tor/marketplace' 'HiddenServicePoWDefensesEnabled 1' \
            'HiddenServicePoWQueueRate 60' 'HiddenServicePoWQueueBurst 600' 'HiddenServiceEnableIntroDoSDefense 1' \
            'HiddenServiceEnableIntroDoSRatePerSec 25' 'HiddenServiceEnableIntroDoSBurstPerSec 200' \
            'HiddenServiceMaxStreams 32' 'HiddenServiceMaxStreamsCloseCircuit 1'; do
            grep -qxF "$line" <<< "$config" || { echo "tor did not load: $line" >&2; exit 1; }
          done
      # A-442: compose.nodes-tor.yaml runs this image as tor-socks with its own deploy/torrc-socks, a read-only root and a
      # fresh data volume (whose ownership comes from the image). --verify-config also checks that tor can use the data
      # directory as the image's user. Nothing else parses torrc-socks with the pinned tor.
      - name: Nodes' Tor client configuration (deploy/torrc-socks)
        run: |
          tor=(docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges:true
            -v "$PWD/deploy/torrc-socks:/etc/tor/torrc-socks:ro" -v /var/lib/tor --entrypoint tor opsecmkt-tor:ci
            -f /etc/tor/torrc-socks)
          "${tor[@]}" --verify-config
          config=$("${tor[@]}" --dump-config short)
          echo "$config"
          for line in 'SocksPort 10.199.42.2:9050 IsolateSOCKSAuth IsolateClientAddr IsolateDestAddr IsolateDestPort' 'SocksPolicy reject 10.199.42.1' 'SocksPolicy accept 10.199.42.0/28' \
            'SocksPolicy reject *' 'ControlPort 0' 'DataDirectory /var/lib/tor'; do
            grep -qxF "$line" <<< "$config" || { echo "tor did not load: $line" >&2; exit 1; }
          done
          if grep -q '^HiddenService' <<< "$config"; then echo 'torrc-socks must run no onion service' >&2; exit 1; fi
      - name: Private administrator onion configuration and authorization preflight
        run: |
          clients=$(mktemp -d)
          trap 'rm -rf "$clients"' EXIT
          chmod 755 "$clients"
          tor=(docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges:true
            --tmpfs '/tmp:rw,nosuid,nodev,noexec,mode=1777'
            -v /var/lib/tor -v "$clients:/run/tor-admin-clients:ro"
            --entrypoint /usr/local/bin/tor-admin-entrypoint opsecmkt-tor:ci
            /run/tor-admin-clients /var/lib/tor/admin/authorized_clients tor -f /etc/tor/torrc-admin)
          if output=$("${tor[@]}" --verify-config 2>&1); then
            echo 'private administrator Tor accepted an empty authorization source' >&2; exit 1
          fi
          if ! grep -qF 'refusing to start Tor.' <<< "$output"; then
            printf '%s\n' "$output" >&2
            echo 'private administrator preflight failed before testing authorization' >&2; exit 1
          fi
          # Synthetic public fixture only; no private client key or live onion network is used.
          printf '%s\n' 'descriptor:x25519:N2NU7BSRL6YODZCYPN4CREB54TYLKGIE2KYOQWLFYC23ZJVCE5DQ' > "$clients/operator.auth"
          chmod 644 "$clients/operator.auth"
          "${tor[@]}" --verify-config
          config=$("${tor[@]}" --dump-config short)
          for line in 'SocksPort 0' 'ControlPort 0' 'HiddenServiceDir /var/lib/tor/admin' \
            'HiddenServiceVersion 3' 'HiddenServicePort 80 unix:/run/market-admin/http.sock'; do
            grep -qxF "$line" <<< "$config" || { echo "private tor did not load: $line" >&2; exit 1; }
          done
      # compose.tor.yaml's healthcheck passes once Tor has written its onion address. Tor does that at startup,
      # before it reaches the network; `up --wait` and scripts/install.sh rely on it.
      - name: Onion address written offline (the Tor healthcheck)
        run: |
          grep -qF "test: [CMD-SHELL, 'test -s /var/lib/tor/marketplace/hostname']" compose.tor.yaml
          docker run -d --name tor-offline --network none --add-host app:127.0.0.1 --cap-drop ALL \
            --security-opt no-new-privileges:true opsecmkt-tor:ci
          for _ in $(seq 60); do
            docker exec tor-offline sh -c 'test -s /var/lib/tor/marketplace/hostname' && break
            sleep 1
          done
          docker exec tor-offline sh -c 'test -s /var/lib/tor/marketplace/hostname'
          docker exec tor-offline cat /var/lib/tor/marketplace/hostname | grep -Eq '^[a-z2-7]{56}\.onion$'
          docker rm -f tor-offline
      - name: Install age
        run: |
          sudo apt-get update
          sudo apt-get install -y age
      # The operator guide's .env and onion-identity backup/restore commands, run verbatim with networking disabled.
      - name: Documented onion identity and .env backup and restore
        run: bash scripts/test-tor-identity-restore.sh
        env:
          TOR_IMAGE: opsecmkt-tor:ci
      # A-526: the installer's onion identity import (--onion-key-dir) against this image with networking disabled:
      # identities from Tor imported and served with the same address and key; truncated and mismatched keys refused.
      - name: Onion identity import (scripts/test-tor-identity-import.sh)
        timeout-minutes: 5
        run: bash scripts/test-tor-identity-import.sh
        env:
          TOR_IMAGE: opsecmkt-tor:ci
      # A-524: the pinned monerod, with compose.nodes.yaml's command and networking disabled, starts both its core and
      # restricted RPC servers (stagenet, with the restricted port on stagenet's core default to stand in for mainnet).
      - name: Bundled monerod RPC ports start offline (scripts/test-monerod-ports.sh)
        timeout-minutes: 5
        run: bash scripts/test-monerod-ports.sh
      # A-536: db, monero and monero-escrow-wallet with Compose's rendered user, capabilities, no-new-privileges,
      # read-only root and tmpfs start offline on a new volume and again on the same one.
      - name: Hardened database and node containers start offline (scripts/test-service-hardening.sh)
        timeout-minutes: 10
        run: bash scripts/test-service-hardening.sh
  browser:
    name: Playwright regressions
    runs-on: ubuntu-24.04
    # Allow cold browser setup plus both suites even when package downloads are slow.
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test-ci-only
          POSTGRES_DB: e2e
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U test -d e2e"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Install Playwright browsers and system dependencies
        run: |
          # The runner prefers Azure's mirror, which took 22 minutes in a main run.
          # Use its existing official Ubuntu archive/security fallbacks directly.
          sudo sed -i '\|^http://azure\.archive\.ubuntu\.com/ubuntu/|d' /etc/apt/apt-mirrors.txt
          npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:e2e
        env:
          E2E_DATABASE_URL: postgres://test:test-ci-only@127.0.0.1:5432/e2e?sslmode=disable
      - name: Retention forms with JavaScript disabled on a fresh database
        run: |
          PGPASSWORD=test-ci-only createdb -h 127.0.0.1 -U test e2e_retention
          install -d -m 700 "$RUNNER_TEMP/opsecmkt-retention"
          npx playwright test tests/e2e/db-retention.spec.ts --project=database-chromium --output=test-results-retention
        env:
          E2E_DATABASE_URL: postgres://test:test-ci-only@127.0.0.1:5432/e2e_retention?sslmode=disable
          E2E_RETENTION_STATE_DIR: ${{ runner.temp }}/opsecmkt-retention
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-retention-report
      - name: Preserve browser report and failure traces
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-results
          path: |
            playwright-report/
            test-results/
            playwright-retention-report/
            test-results-retention/
          if-no-files-found: ignore
          retention-days: 14
  browser-escrow:
    name: Escrow browser journeys (simulated nodes, real application)
    runs-on: ubuntu-24.04
    # Two suites (each test allows 4 to 5 minutes), a cold `go run` build per server and a Chromium-only install.
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test-ci-only
          POSTGRES_DB: e2e
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U test -d e2e"
          --health-interval 5s --health-retries 20 --health-timeout 5s
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Install Chromium and system dependencies
        run: |
          # The runner prefers Azure's mirror, which took 22 minutes in a main run.
          # Use its existing official Ubuntu archive/security fallbacks directly.
          sudo sed -i '\|^http://azure\.archive\.ubuntu\.com/ubuntu/|d' /etc/apt/apt-mirrors.txt
          npx playwright install --with-deps chromium
      # The Monero journey owns a fresh database because it moves clocks through SQL.
      - name: Create the escrow databases
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          docker exec "$POSTGRES_CONTAINER" createdb -U test e2e_escrow_xmr
      # Simulated escrow nodes (tests/e2e/fixtures): application integration evidence, not chain evidence.
      - name: Monero escrow journey (simulated escrow wallet-rpc)
        env:
          E2E_ESCROW_XMR_DATABASE_URL: postgres://test:test-ci-only@127.0.0.1:5432/e2e_escrow_xmr?sslmode=disable
        run: npm run test:e2e:escrow-xmr
      - name: Preserve escrow browser reports and failure traces
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-escrow-results
          path: |
            playwright-escrow-xmr-report/
            test-results-escrow-xmr/
          if-no-files-found: ignore
          retention-days: 14
  docs:
    name: Documentation site builds with no broken link or anchor
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the hash-locked MkDocs toolchain
        run: |
          python3 -m venv .venv-docs
          .venv-docs/bin/pip install --require-hashes --no-deps -r requirements-docs.txt
      - name: Build in strict mode (mkdocs.yml)
        run: .venv-docs/bin/mkdocs build
      - name: Cloudflare Worker headers (deploy/docs/cloudflare)
        run: node --test deploy/docs/cloudflare/worker.test.mjs
  required:
    name: CI passed
    if: always()
    needs: [quality, workflow-safety, security, go, go-escrow, escrow-xmr-regtest, operations, installer, upgrade, compose, container, tor-image, browser, browser-escrow, docs]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every test job to pass
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os
          results = json.loads(os.environ['RESULTS'])
          failures = [name for name, job in results.items() if job['result'] != 'success']
          if failures:
              raise SystemExit('Failed or skipped required jobs: ' + ', '.join(failures))
          PY
