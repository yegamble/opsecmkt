name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  go:
    name: Go and PostgreSQL
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test-ci-only
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U test -d postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://test:test-ci-only@127.0.0.1:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Formatting, modules, vet and races (including real PostgreSQL)
        run: |
          test -z "$(gofmt -l cmd internal)"
          go mod verify
          go vet ./...
          go test -race -count=1 -coverprofile=coverage.out ./...
      - name: Validate workflow definitions
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - name: Reachable Go vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: go-coverage
          path: coverage.out
          retention-days: 14
  operations:
    name: Operations and encrypted restore
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test-ci-only
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U test -d postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Install PostgreSQL 17 client and encryption tools
        run: |
          sudo apt-get update
          sudo apt-get install -y curl ca-certificates gnupg
          sudo install -d /usr/share/postgresql-common/pgdg
          curl --fail --show-error --silent --location https://www.postgresql.org/media/keys/ACCC4CF8.asc -o "$RUNNER_TEMP/pgdg.asc"
          fingerprint=$(gpg --show-keys --with-colons "$RUNNER_TEMP/pgdg.asc" | awk -F: '$1 == "fpr" { print $10; exit }')
          test "$fingerprint" = B97B0AFCAA1A47F044F244A07FCC7D46ACCC4CF8
          sudo install -m 0644 "$RUNNER_TEMP/pgdg.asc" /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          # Hosted ubuntu-24.04 uses noble; scope trust to this repository only.
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt noble-pgdg main" | sudo tee /etc/apt/sources.list.d/opsecmkt-pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17 age
          echo /usr/lib/postgresql/17/bin >> "$GITHUB_PATH"
      - name: Shell syntax and Python helper regressions
        run: |
          for script in scripts/*.sh; do bash -n "$script"; done
          python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Encrypted backup and restore against PostgreSQL
        run: bash scripts/test-backup-restore.sh
        env:
          TEST_DATABASE_URL: postgres://test:test-ci-only@127.0.0.1:5432/postgres?sslmode=disable
      # The default deployment: its db service publishes no port, so backup and restore run inside it.
      - name: Encrypted backup and restore through the internal-db Compose service
        run: bash scripts/test-internal-db-restore.sh
  compose:
    name: Compose (${{ matrix.mode }}, ${{ matrix.database }}, mirror=${{ matrix.mirror }})
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        mode: [clearnet, tor]
        database: [internal, external]
        mirror: ['off', 'on']
        exclude:
          - mode: clearnet
            mirror: 'on'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate all deployment profiles
        env:
          MODE: ${{ matrix.mode }}
          DATABASE: ${{ matrix.database }}
          MIRROR: ${{ matrix.mirror }}
          DATABASE_URL: postgres://test:test@db/test
          SETUP_TOKEN: ci-validation-only-not-a-real-bootstrap-secret
        run: |
          files=(-f compose.yaml -f "compose.$MODE.yaml" -f compose.nodes.yaml)
          profiles=(--profile bitcoin --profile monero --profile monero-wallet)
          if [ "$DATABASE" = internal ]; then
            files+=(-f compose.internal-db.yaml)
            profiles+=(--profile internal-db)
          elif [ "$MODE" = tor ]; then
            files+=(-f compose.external-egress.yaml)
          fi
          if [ "$MIRROR" = on ]; then
            profiles+=(--profile mirror)
          fi
          docker compose "${files[@]}" "${profiles[@]}" config --quiet
          # torrc resolves app:8080 once at startup, so Tor must restart whenever the app is recreated.
          if [ "$MODE" = tor ]; then
            docker compose "${files[@]}" "${profiles[@]}" config --format json | python3 -c '
          import json, sys
          services = json.load(sys.stdin)["services"]
          names = ["tor"] + (["tor-mirror"] if sys.argv[1] == "on" else [])
          for name in names:
              app = services.get(name, {}).get("depends_on", {}).get("app", {})
              if app.get("condition") != "service_started" or app.get("restart") is not True:
                  sys.exit(f"{name} must depend on app with condition service_started and restart: true, got {app!r}")
          print("restart with app:", ", ".join(names))
          ' "$MIRROR"
          fi
          # Local nodes are pruned by default; BITCOIN_PRUNE_MB=0 and a blank MONERO_PRUNE_FLAGS run full nodes.
          check_nodes() {
            docker compose "${files[@]}" "${profiles[@]}" config --format json | python3 -c '
          import json, sys
          services = json.load(sys.stdin)["services"]
          bitcoin, monero = services["bitcoin"]["command"], services["monero"]["command"]
          pruned = sys.argv[1] == "pruned"
          if "-datadir=/data" not in bitcoin:
              sys.exit(f"bitcoin must run with -datadir=/data, got {bitcoin!r}")
          prune = [arg for arg in bitcoin if arg.startswith("-prune")]
          if pruned and not (len(prune) == 1 and prune[0].startswith("-prune=") and prune[0][7:].isdigit() and int(prune[0][7:]) >= 550):
              sys.exit(f"bitcoin must run pruned with -prune=<MiB >= 550>, got {prune!r}")
          if not pruned and prune != ["-prune=0"]:
              sys.exit(f"a full bitcoin node must run with -prune=0, got {prune!r}")
          for flag in ("--stagenet", "--data-dir=/home/monero/.bitmonero", "--restricted-rpc", "--confirm-external-bind"):
              if flag not in monero:
                  sys.exit(f"monero lost {flag}: {monero!r}")
          if "" in monero:
              sys.exit(f"monero command has an empty argument: {monero!r}")
          want = ["--prune-blockchain", "--sync-pruned-blocks"] if pruned else []
          if [arg for arg in monero if "prune" in arg] != want:
              sys.exit(f"monero prune flags must be {want!r}, got {monero!r}")
          print(sys.argv[1], "nodes:", prune[0], " ".join(want) or "no monero prune flags")
          ' "$1"
          }
          check_nodes pruned
          BITCOIN_PRUNE_MB=0 MONERO_PRUNE_FLAGS='' check_nodes full
  container:
    name: Container runtime (${{ matrix.database }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        database: [internal, external]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: opsecmkt:ci
          cache-from: type=gha,scope=app
          cache-to: type=gha,mode=max,scope=app
      - name: Bootstrap production image with a real database
        run: bash scripts/ci-smoke.sh "${{ matrix.database }}"
  installer:
    name: Local installer and browser setup wizard
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install, bootstrap and restart an isolated real deployment
        run: python3 scripts/test-install.py
      - name: Preserve installer evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: installer-results
          path: artifacts/install-test/
          if-no-files-found: ignore
          retention-days: 14
  upgrade:
    name: Upgrade from v0.1.0-alpha.1
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history and tags: the test builds and runs the v0.1.0-alpha.1 server from its tag.
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Migrate a populated alpha.1 database on PostgreSQL 17 with the current server
        run: bash scripts/test-upgrade.sh
  tor-image:
    name: Tor image and offline configuration
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: deploy
          file: deploy/Dockerfile.tor
          load: true
          tags: opsecmkt-tor:ci
          cache-from: type=gha,scope=tor
          cache-to: type=gha,mode=max,scope=tor
      - name: Validate Tor configuration without network access
        run: docker run --rm --network none --add-host app:127.0.0.1 --cap-drop ALL --security-opt no-new-privileges:true opsecmkt-tor:ci --verify-config
  browser:
    name: Playwright regressions
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test-ci-only
          POSTGRES_DB: e2e
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U test -d e2e"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:e2e
        env:
          E2E_DATABASE_URL: postgres://test:test-ci-only@127.0.0.1:5432/e2e?sslmode=disable
      - name: Wallet-backed browser journeys (simulated RPC, real application)
        env:
          E2E_WALLET_DATABASE_URL: postgres://test:test-ci-only@127.0.0.1:5432/e2e_wallet?sslmode=disable
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          docker exec "$POSTGRES_CONTAINER" createdb -U test e2e_wallet
          npm run test:e2e:wallet
      - name: Preserve browser report and failure traces
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-results
          path: |
            playwright-report/
            test-results/
            playwright-wallet-report/
            test-results-wallet/
          if-no-files-found: ignore
          retention-days: 14
  required:
    name: CI passed
    if: always()
    needs: [go, operations, installer, upgrade, compose, container, tor-image, browser]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every test job to pass
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os
          results = json.loads(os.environ['RESULTS'])
          failures = [name for name, job in results.items() if job['result'] != 'success']
          if failures:
              raise SystemExit('Failed or skipped required jobs: ' + ', '.join(failures))
          PY
