{{define "market-wordmark"}}{{$name := or (index .Settings "site_name") "OPSEC Market"}}{{if and .Branding .Branding.LogoURL}}<img class="market-logo" src="{{.Branding.LogoURL}}" alt="{{$name}}" width="224" height="56">{{else}}<span class="market-wordmark" title="{{$name}}"><span class="wordmark-bracket">[</span>{{if eq $name "OPSEC Market"}}OPSEC<span class="wordmark-accent">MKT</span>{{else}}<span class="market-wordmark-name">{{$name}}</span>{{end}}<span class="wordmark-bracket">]</span></span>{{end}}{{end}}
